          # par défaut — l'écart reste **220**.
          # RÉ-MESURÉ le 2026-08-23 par la MÊME commande, sur l'arbre qui porte P11.3-c et P11.3-d (cinq
          # tests sans `cfg`) : 1469 avec `cold_tier` pour 1249 par défaut — l'écart reste **220**.
          # RÉ-MESURÉ le 2026-08-24 par la MÊME commande, sur l'arbre qui porte le lot d'intégrité
          # P11.5-d (six tests sans `cfg`) : 1484 avec `cold_tier` pour 1264 par défaut — l'écart reste
          # **220**. Ce compteur-ci bouge AVEC l'autre : six tests sans `cfg` entrent dans les deux
          # profils, et le laisser en arrière rendrait ce job rouge sans rien mesurer de neuf.
          # RÉ-MESURÉ le 2026-08-24 par la MÊME commande, sur l'arbre qui porte la garde P6.8-d
          # (quatre tests sans `cfg` : les index d'expression des champs chauds constatés au
          # catalogue d'une base migrée) : 1488 avec `cold_tier` pour 1268 par défaut — l'écart
