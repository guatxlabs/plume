          #
          # 1280 : MESURÉ le 2026-08-20 par ÉNUMÉRATION (`cargo test --features cold_tier -- --list`,
          # deux lectures concordantes à 1280) — pas par exécution. Les six tests du lot « exercice de
          # restauration » (P8.3-a) sont les MÊMES que ceux de la suite par défaut : la feature n'en
          # ajoute aucun, et c'est attendu — la sauvegarde chaude, sa vérification et le suivi de
          # l'exercice ne dépendent pas du tier froid. L'écart cold−défaut reste donc **220**,
          # inchangé. Même constat pour les six tests de la borne interactive (P7.8-a) : ils portent
          # sur le sémaphore des routes CHAUDES, que le tier froid ne change pas — ils sont donc les
