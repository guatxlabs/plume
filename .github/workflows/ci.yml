          # devenue redondante) : 1345 avec `cold_tier` pour 1125 par défaut — l'écart reste **220**.
          # RÉ-ÉNUMÉRÉ le 2026-08-20 par la MÊME double lecture, sur l'arbre qui porte aussi le lot S32
          # (lectures d'environnement séparant « lu » de « pas lisible », dix-huit tests sans `cfg`) :
          # 1368 avec `cold_tier` pour 1148 par défaut — l'écart reste **220**.
