          # RÉ-MESURÉ le 2026-08-24 par la MÊME commande, sur l'arbre qui porte le correctif P6.8-f
          # (trois tests sans `cfg` : le compte rendu de la passe d'index constaté au catalogue au
          # lieu d'être récité depuis la déclaration) : 1491 avec `cold_tier` pour 1271 par défaut —
          # l'écart reste **220**. Ce compteur-ci bouge AVEC l'autre : trois tests sans `cfg` entrent
          # dans les deux profils, et le laisser en arrière rendrait ce job rouge sans rien mesurer
          # de neuf.
          # RÉ-MESURÉ le 2026-08-24 par la MÊME commande, sur l'arbre qui porte le correctif P6.8-e
          # (cinq tests sans `cfg` : le retrait de fond des index de champ chaud orphelins, dérivé du
          # préfixe de la famille) : 1496 avec `cold_tier` pour 1276 par défaut — l'écart reste
          # **220**. Ce compteur-ci bouge AVEC l'autre : cinq tests sans `cfg` entrent dans les deux
          # profils, et le laisser en arrière rendrait ce job rouge sans rien mesurer de neuf.
          # RÉ-MESURÉ le 2026-08-24 par la MÊME commande, sur l'arbre qui porte le correctif P6.8-g
          # (cinq tests sans `cfg` : le constat de présence d'un index comparé à la définition et non
          # à l'étiquette) : 1501 avec `cold_tier` pour 1281 par défaut — l'écart reste **220**. Ce
          # compteur-ci bouge AVEC l'autre : cinq tests sans `cfg` entrent dans les deux profils, et
          # le laisser en arrière rendrait ce job rouge sans rien mesurer de neuf.
          # RÉ-MESURÉ le 2026-08-24 par la MÊME commande, sur l'arbre qui porte le correctif P10.1-b
          # (cinq tests sans `cfg` : le quota qui borne la taille du déversement des tris) : 1506 avec
          # `cold_tier` pour 1286 par défaut — l'écart reste **220**. Ce compteur-ci bouge AVEC
          # l'autre : cinq tests sans `cfg` entrent dans les deux profils, et le laisser en arrière
          # rendrait ce job rouge sans rien mesurer de neuf.
          EXPECTED_COLD_TESTS: "1552"
          EXPECTED_DEFAULT_TESTS: ${{ env.EXPECTED_TESTS }}
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP/plume-tmp-cold"
          rm -rf "$TMPDIR"; mkdir -p "$TMPDIR"
          cargo test --locked --features cold_tier --verbose 2>&1 | tee /tmp/cold-tests.log
          total=$(awk '/^test result: ok\. [0-9]+ passed/{s+=$4} END{print s+0}' /tmp/cold-tests.log)
          echo "cold_tier tests passed: $total (expected $EXPECTED_COLD_TESTS)"
          if [ "$total" != "$EXPECTED_COLD_TESTS" ]; then
            echo "::error::cold_tier suite test count is $total, expected $EXPECTED_COLD_TESTS."
            echo "::error::If the change legitimately adds or removes cold_tier tests, update"
            echo "::error::EXPECTED_COLD_TESTS HERE, from your own measurement — and nowhere else."
            echo "::error::(This message used to send you to a number in CONTRIBUTING.md; there is none,"
            echo "::error:: and CONTRIBUTING says so itself: the live counters live ONLY in this file.)"
            exit 1
          fi
          # Anti-rot: this job must actually be running MORE than the default suite.
          if [ "$EXPECTED_COLD_TESTS" -le "$EXPECTED_DEFAULT_TESTS" ]; then
            echo "::error::EXPECTED_COLD_TESTS ($EXPECTED_COLD_TESTS) <= EXPECTED_TESTS ($EXPECTED_DEFAULT_TESTS):"
            echo "::error::the cold_tier feature is no longer contributing tests — this job has become a no-op."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # shell — SYNTAX GATE FOR THE COLLECTORS.
  #
  # WHY: the shell collectors are a production ingest path (43 tracked scripts, ~3.9k lines
  # measured today) and NOTHING in this pipeline looked at them — `grep -rE
  # "shellcheck|shfmt|bash -n" .github/` returned zero hits. A stray `fi`, an unclosed quote or
  # a broken heredoc shipped green and only failed on the host, at collection time, as MISSING
  # DATA — the same silent-loss failure mode the cold-tier job exists for.
  #
  # WHAT THIS DOES AND DOES NOT GUARANTEE — read before trusting it:
  #   `bash -n` is a PARSE check. It proves each script is syntactically valid bash. It proves
  #   NOTHING about behaviour: an unquoted variable, a wrong path, a silently-failing pipeline
  #   all parse fine. This is a floor, not a safety net.
  # ---------------------------------------------------------------------------
  shell:
    name: shell (bash -n — all tracked scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout plume
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # `P8.9-f` — la garde « l'index concorde avec ce qu'un commit déclare fermé » compare
          # l'HISTOIRE à l'index. MESURÉ le 2026-08-25 : sur un clone `--depth 1` elle sort en 2,
          # c'est-à-dire qu'elle REFUSE DE CONCLURE au lieu de verdir en étant aveugle — le
          # comportement voulu, mais elle n'atteste alors rien. L'historique complet est ce qui la
          # rend utile ; ce dépôt en compte quelques centaines de commits, le coût est nul.
          fetch-depth: 0

      # Le compteur de la suite est écrit ICI et NULLE PART AILLEURS. Il l'a été dans quatre
      # fichiers, et CONTRIBUTING prescrivait même de mettre les quatre à jour ; relevé le
      # 2026-07-30 alors que ce fichier était juste : CONTRIBUTING disait 758, audit.toml 762,
      # tests/saml.rs et tests/ai.rs 600 — soit 162 de moins que le réel. Un compteur dupliqué
      # ne fait que pourrir, et il pourrit vers le dangereux : un lecteur croit la suite plus
      # petite qu'elle n'est, donc qu'un écart de comptage est normal, alors que la CONSTANCE
      # de ce compte est l'invariant qui prouve qu'une feature OFF ne touche pas le build par
      # défaut. La garde n'énumère aucun fichier : elle lit la valeur vivante ici et exige
      # qu'elle n'apparaisse pas ailleurs, plus que toute affirmation chiffrée sur la taille de
      # la suite porte son ANNÉE — c'est cette seconde jambe qui attrape le nombre PÉRIMÉ, que
      # la première ne peut pas voir. Motif calibré par mesure (une version trop large faisait
      # 30+ faux positifs sur des ID d'événements et des adresses IP) ; résidus écrits dans le
      # script, pas cachés.
      - name: Le compte de tests n'existe qu'à un seul endroit, et toute mesure est datée
        run: python3 .github/scripts/check_no_duplicated_test_count.py

      # Un capteur qui ne peut pas collecter doit le DIRE. MESURÉ le 2026-08-01 sur une VM Ubuntu
      # 24.04 Server fraîche : `auditd.sh` sortait en SUCCÈS sans rien émettre parce que auditd
      # n'est pas installé — le SOC ne pouvait pas distinguer « capteur aveugle » de « rien à
      # signaler ». MESURÉ : 29 des 37 capteurs livrés portaient la même forme, 50 sorties muettes.
      # La garde n'énumère aucun capteur : elle exige que TOUTE sortie anticipée soit classée par
      # l'une des trois primitives de lib.sh, donc un capteur écrit demain est couvert d'office.
      - name: Un capteur qui ne peut pas collecter doit le dire (aucune sortie muette)
        run: python3 .github/scripts/check_collector_exit_is_classified.py

      # MÊME DÉFAUT, AUTRE LANGAGE — et sur la flotte DOMINANTE en entreprise. La garde ci-dessus ne
      # balaie que `collectors/*.sh` : le collecteur Windows était hors périmètre, et il portait les
      # deux défauts. MESURÉ le 2026-08-02 (harnais pwsh, collecteur exécuté TEL QUEL) : (1) central
      # indisponible pendant UN run -> 42 événements éligibles, 0 arrivés, filigrane avancé quand
      # même -> 42 PERDUS DÉFINITIVEMENT ; (2) journal Security en accès refusé -> 12 attendus, 0
      # arrivé, 0 aveu, code retour 0, battement « ok ». Après correctif, mêmes scénarios :
      # 0 perdu / 42 rattrapés, et 5 aveux `collect_status=unavailable`.
      # La garde ne cite aucun capteur : elle exige que tout `catch` classe ou relève, qu'aucune
      # erreur ne soit avalée en silence, et qu'aucun filigrane ne s'écrive avant un POST acquitté.
      # `pwsh` est fourni par l'image ubuntu-24.04 (PowerShell 7.6.3, vérifié dans le README de
      # actions/runner-images) ; s'il manquait, la garde ÉCHOUE au lieu de passer.
      - name: Le collecteur Windows ne peut ni mentir ni oublier (AST PowerShell)
        run: python3 .github/scripts/check_windows_collector_is_honest.py

      # MÊME FAMILLE, AUTRE CAUSE : ici le capteur n'est pas muet, il ANNONCE une couverture que son
      # propre bac à sable lui retire. MESURÉ le 2026-08-20 (systemd 261, sonde différentielle à une
      # seule variable, `collectors/integrity.sh` exécuté TEL QUEL) : sous le `ProtectHome=true` que
      # le drop-in de durcissement partagé posait — un SCALAIRE, donc last-wins sur le
      # `ProtectHome=read-only` que l'unit posait exprès — la baseline FIM perd EXACTEMENT une
      # famille : 86 lignes au lieu de 87, zéro entrée `authkeys` au lieu de 1. Les clés SSH
      # autorisées, vecteur de persistance annoncé par l'en-tête du capteur ET livré comme détection
      # (docs/DETECTION-CATALOG.md, T1098.004), n'étaient donc pas surveillées sur un hôte agent —
      # sans erreur, sans avertissement, et alors qu'un central, lui, les surveillait.
      # La garde n'énumère aucun chemin : elle EXTRAIT la liste annoncée du capteur, recompose le bac
      # à sable effectif (unit + drop-in, scalaires écrasés / listes unionnées) et refuse tout chemin
      # annoncé devenu injoignable. Elle porte ses propres témoins positif et négatif.
      - name: La couverture ANNONCÉE par un capteur doit être ATTEIGNABLE sous son bac à sable
        run: python3 .github/scripts/check_fim_coverage_is_reachable.py
      - { name: "Le capteur d'intégrité voit un drop-in systemd et les types d'unités du chemin de recherche DÉRIVÉ, dit la voie, et avoue un répertoire illisible (P3.8-a)", run: .github/scripts/verifier-fim-couvre-les-unites-systemd.sh }

      # MÊME FAMILLE ENCORE, ET C'EST LA PLUS COÛTEUSE : ici le capteur n'est ni muet ni amputé — il
      # PUBLIE, et ce qu'il publie est la valeur la plus rassurante de sa série. `collectors/resources.sh`
      # alimente QUATRE règles à seuil (mémoire, fuite slab noyau, processeur, occupation du disque
      # racine). Une règle dont l'entrée vaut 0 n'est pas en retard : elle est STRUCTURELLEMENT INERTE,
      # et rien ne le dit. Quatre chemins y menaient — un bloc `END` d'awk qui imprime 0 quand le motif
      # n'a jamais matché, le code de retour de `df` avalé par le tube, un motif de noms d'interface
      # qui ne matche aucune convention usuelle (`ens3`, `eno1`, `wlp3s0`), et une variable vide
      # interpolée DANS un programme awk. La garde exécute le capteur TEL QU'IL EST LIVRÉ contre une
      # arborescence fabriquée et un `df` stubé : rien de la machine de CI n'entre dans le verdict.
      # Elle exige les DEUX témoins et n'énumère aucune mesure (les clés du second sont découvertes
      # dans la sortie du premier) : source lisible valant réellement zéro -> la mesure est PUBLIÉE
      # à 0 ; source non exploitable -> AUCUN nombre, et un aveu qui NOMME la clé et sa cause.
      - name: Une mesure d'hôte qui n'a pas pu être prise n'est pas publiée comme un zéro
        run: python3 .github/scripts/check_host_measures_are_honest.py

      # LA MÊME CHAÎNE, À SON DERNIER MAILLON (`S37`) : le démon publie `<clé>_verdict` / `_cause` /
      # `_detail` à côté de chaque grandeur qu'il n'a pas pu lire (`S32`, `P4.1-r`), et tout s'arrête à
      # la frontière du navigateur si la surface ne LIT pas le verdict — une grandeur illisible s'y
      # rend alors comme un zéro, un tiret ou une case vide. La garde DÉRIVE du code du démon
      # l'ensemble des clés émises (appels à `poser_dans` / `poser_verdict_dans` / `poser_bilan`,
      # gabarit `{boucle}_abandons` résolu sur la table des boucles) et exige qu'un module web lise
      # chacune dans son CODE — une clé citée en commentaire ne compte pas. Elle valide son instrument
      # dans les deux sens, refuse de conclure sous trois clés ou sans sa clé témoin, puis lance le
      # harnais ESM (`web_esm_harnais.mjs`, shim DOM sans réseau) qui lie les modules de `web/` et
      # rend le panneau Système sur des objets fabriqués : état « NON LISIBLE » avec sa cause, abandons
      # visibles, et la valeur — vrai zéro compris — quand le verdict est « lu ».
      - name: La surface web lit chaque verdict que le démon publie, et le rend comme un état
        run: python3 .github/scripts/check_web_reads_every_verdict.py
      - { name: "Toute route sensible du démon (détruit / élève un droit / arme une réponse — DÉRIVÉE du routeur) a ses appelants web derrière la confirmation partagée (P11.5-b)", run: python3 .github/scripts/check_sensitive_routes_are_confirmed.py }
      - { name: "Aucun bouton de la surface web sans classe partagée ni contexte stylant — contextes et classes DÉRIVÉS de style.css, sites dérivés des modules (P11.4-b)", run: python3 .github/scripts/check_every_button_wears_shared_chrome.py }

      # `P11.14-c` — UN REFUS NE SE REND JAMAIS COMME UNE ABSENCE. Le panneau DLP décidait de son
      # affichage sur UNE condition (`!j || j.error || !Array.isArray(j.rows) || !j.rows.length`) :
      # un refus du démon, une réponse illisible, une panne réseau et un vrai vide y entraient, et
      # « Aucun changement récent (<fenêtre>) — ou capteur inactif » en sortait. D'où la contradiction
      # relevée en usage réel le 2026-08-25 — toute la rétention rendant MOINS que sept jours — alors
      # que le SQL de la fenêtre large est celui de l'étroite MOINS son conjoint `ts >= …` et rend
      # toujours au moins autant : ce que le démon rendait de différent, c'était un REFUS (422 froid
      # tronqué, 400 budget). La garde juge la CONDITION, pas la phrase (une phrase se reformule) :
      # aucune expression de `web/` ne doit décider dans le MÊME test qu'une lecture a échoué et
      # qu'elle est vide. Population DÉCOUVERTE par parcours de `web/`, instrument validé dans les
      # deux sens, refus de conclure sous ses planchers. Ce qu'elle NE tient PAS — la phrase rendue
      # ensuite — est tenu par le harnais ESM (témoin 16), qui exige trois issues distinctes.
      - { name: "Un refus du démon ne se rend jamais comme une absence de données — aucune condition de web/ ne fond l'échec et le vide (P11.14-c)", run: python3 .github/scripts/check_a_refusal_is_not_rendered_as_an_absence.py }

      # `P11.18-w` — L'ENVIRONNEMENT DU PROCESSUS EST **UNE** RESSOURCE, ET ELLE N'A QU'UN VERROU.
      # `cfg()` résout toute clé dans l'ordre `env > conf > défaut` : un test qui pose une variable ne règle
      # pas SON comportement, il règle celui de tous les tests qui tournent au même instant — et il écrase la
      # `conf` d'un voisin qui croyait décider seul. MESURÉ le 2026-08-25 : un test du tier froid a échoué UNE
      # FOIS SUR DEUX exécutions complètes, sur une assertion qui DIT « tier froid OFF » pendant qu'un test de
      # plafonds posait la variable à 1 — une intégration continue rouge que rien ne distinguait d'une
      # régression réelle. LA CAUSE N'ÉTAIT PAS L'ABSENCE DE VERROU MAIS LEUR NOMBRE : NEUF verrous pour une
      # seule ressource, plus DOUZE tests sans aucun. Deux verrous pour une ressource, c'est zéro verrou.
      # Il n'en reste qu'UN, et cette garde refuse tout test qui mute l'environnement sans le tenir EN
      # ÉCRITURE — le mode qui exclut, un mutateur sous verrou de lecture n'excluant personne. Population et
      # mutateurs DÉRIVÉS des sources, fonctions associées comprises, sans quoi deux utilitaires passaient ;
      # corpus lu sur le SYSTÈME DE FICHIERS et non `git ls-files` (`P11.13-d`) ; témoins positif, négatif, de
      # mode et de fermeture ; refus de conclure (sortie 2) sous ses planchers. Elle DIT ce qu'elle ne tient
      # pas : le côté lecteur, qui n'est pas une propriété syntaxique, et la durée de tenue.
      - { name: "Aucun test du démon ne mute une variable d'environnement du processus sans tenir EN ÉCRITURE le verrou UNIQUE de cette ressource (P11.18-w)", run: python3 .github/scripts/check_no_test_mutates_the_process_env_unlocked.py }

      # `P11.4-d` — AUCUNE RÈGLE DE STYLE SANS CIBLE. Les sélecteurs d'identifiant et de classe sont DÉRIVÉS de
      # `style.css`, le corpus où un nom peut être posé est DÉRIVÉ de `web/` (code sans commentaires) ; un nom
      # construit par concaténation ou gabarit est « indécidable » et nommé, jamais compté orphelin. Mesuré le
      # 2026-08-22 : 521 noms distincts, 15 orphelins (dont `#ack-all`, mort depuis le chrome partagé), tous
      # retirés ; plafond zéro. L'instrument se valide (une règle `#inexistant{}` rougit, `.btn` non).
      - { name: "Chaque identifiant ou classe ciblé par style.css est posé quelque part dans web/ — dérivé, plafond d'orphelins à zéro (P11.4-d)", run: python3 .github/scripts/check_every_style_selector_has_a_target.py }
      # `P11.4-e` — CHAQUE DÉCLENCHEUR D'AIDE OUVRE UNE SECTION. Déclencheurs DÉRIVÉS de `web/` (`data-help`
      # en HTML et dans les gabarits, `dataset.help`, `openHelp('…')`, entrées du sommaire du guide), sections
      # DÉRIVÉES de l'objet `HELP` du registre d'aide (`web/help_registry.js`, lui-même dérivé de sa définition,
      # pas nommé) ; une section sans déclencheur est une information. Mesuré le
      # 2026-08-22 : deux déclencheurs sans section (« tokens » en HTML, « processors » au sommaire du guide) ;
      # l'ouvreur se taisait (harnais : zéro nœud rendu), il rend désormais un aveu qui nomme la clé.
      - { name: "Chaque déclencheur d'aide de la console (HTML et JS) ouvre une section du registre d'aide — dérivé dans les deux sens, module du registre dérivé (P11.4-e)", run: python3 .github/scripts/check_every_help_trigger_has_a_section.py }

      # `P11.8-a` — LE LEXIQUE FR/EN COUVRE CE QUE CHAQUE MODULE AFFICHE. La console traduit par dictionnaire
      # (`i18n.js`, correspondance EXACTE d'un nœud texte ou d'un attribut affiché) : une chaîne sans clé
      # reste en français, en silence. MESURÉ le 2026-08-22 sur la propriété « chaîne posée dans un puits de
      # rendu » (critère écrit dans la garde, avec ce qu'elle ne voit pas) : 1 568 chaînes statiques affichées,
      # 16 % couvertes avant complément. La garde DÉRIVE la population du code (puits de rendu, littéraux HTML,
      # `index.html`), valide son instrument sur un corpus témoin dans les deux sens, refuse de conclure sous
      # ses planchers, et tient un PLAFOND DE TROUS par module : une chaîne affichée de plus sans entrée rougit.
      - name: Le lexique fr/en couvre les chaînes affichées de chaque module web (aucun trou de plus)
        run: python3 .github/scripts/check_i18n_lexicon_covers_displayed_strings.py

      # LA MÊME FIGURE, PORTÉE À LA SURFACE ENTIÈRE : la garde ci-dessus tient UNE mesure d'hôte sur
      # UN capteur ; celle-ci tient tout capteur shell qui publie des NOMBRES. Sa portée est
      # DÉCOUVERTE (le capteur publie une enveloppe `kind:"metrics"`), jamais listée — un capteur de
      # métriques ajouté demain est contrôlé d'office. Elle exécute chaque capteur TEL QU'IL EST
      # LIVRÉ contre un PATH fabriqué où ses commandes externes sont des stubs, et mute UN SEUL BIT :
      # au témoin (1) tous rendent 0 avec une sortie vide (une source LUE, réellement vide) ; au
      # témoin (2) une seule commande rend 1 (cette lecture-là a échoué). Ce qu'elle exige est que la
      # sortie PUBLIÉE change avec ce bit, que l'aveu NOMME les séries perdues, et qu'il n'en nomme
      # aucune qui soit encore publiée. Les clés ne sont pas énumérées : celles du témoin (2) sont
      # découvertes dans la sortie du témoin (1). Elle valide son propre instrument avant de croire
      # son verdict — fragments témoins pour la part statique, extracteur de commandes contrôlé dans
      # les deux sens, et mutation déclarée INCONCLUANTE plutôt que verte quand une sortie vide n'est
      # pas une lecture nominale. Sous deux capteurs exerçables, elle ÉCHOUE au lieu de conclure.
      - name: Un capteur shell ne publie pas un nombre qu'il n'a pas pu lire
        run: python3 .github/scripts/check_collector_reads_are_honest.py

      # MÊME FAMILLE, PORTÉE SUR UN MÉCANISME DE SÉCURITÉ, ET C'EST LÀ QU'ELLE COÛTE LE PLUS : un
      # enforcer qui ne peut pas lire sa LISTE DE PROTECTION prenait la branche la plus permissive,
      # et rien ne le disait. `respond.sh` lisait la liste des IP à NE JAMAIS bannir par
      # `[ -r "$F" ] && grep -qxF ...` : fichier manquant, accès refusé et recherche en erreur (un
      # RÉPERTOIRE — `-r` le passe, et sous root il passe même un mode 000) tombaient sur la même
      # branche que « lue, l'IP n'y est pas », c'est-à-dire sur « bannis ». `engagement-adapter.sh`
      # faisait pire : son en-tête ÉCRIT l'invariant inverse (« une exemption est une défense
      # BAISSÉE : son mode de panne DOIT être re-arm »), et son compteur d'armement se lisait
      # `"$(cat "$F" 2>/dev/null || echo 0)"` — un compteur illisible ne franchit JAMAIS son seuil,
      # donc le REVERT-ALL promis ne partait plus tant que le central restait injoignable.
      # La garde n'écrit AUCUNE liste d'enforcers : elle la DÉRIVE de la garde ci-dessus (dont le
      # critère est déjà auto-invalidant), et rougit tant qu'un enforcer ajouté là-bas n'a pas ici
      # ses DEUX témoins. Chaque enforcer est exécuté TEL QU'IL EST LIVRÉ, dans un PATH fabriqué où
      # `curl`/`nft` sont des bouchons : liste illisible -> la protection REFUSE et le refus est
      # NOMMÉ (cause de l'ensemble fermé) ; liste lisible et RÉELLEMENT vide -> comportement normal,
      # sans refus. Sans ce second témoin, un enforcer qui refuserait toujours passerait le premier.
      - name: Un enforcer qui ne peut pas lire sa liste de protection REFUSE (fail-closed)
        run: python3 .github/scripts/check_enforcer_lists_fail_closed.py

      # MÊME FAMILLE, APPLIQUÉE À LA DOCUMENTATION : ici ce n'est pas une couverture annoncée qui est
      # injoignable, c'est le DOCUMENT lui-même. Un document à jour que rien ne référence est
      # invisible, donc inexistant pour le lecteur. MESURÉ le 2026-08-20 : 11 des 45 documents suivis
      # n'étaient la cible d'AUCUN lien Markdown — dont le document de conception portant l'état le
      # plus frais des travaux d'échelle, l'agent d'endpoint, le récepteur syslog et le harnais de
      # mesure. Aucun n'était brouillon ; chacun était introuvable.
      # La garde n'énumère aucun document : elle découvre les documents suivis par `git ls-files` et
      # exige un CHEMIN DE LIENS depuis `README.md`. Une MENTION en texte brut ne compte pas — c'est
      # exactement sous cette forme que le document d'échelle était « référencé », et une garde qui
      # l'aurait acceptée serait passée au vert sur le défaut qu'elle doit attraper. Elle porte ses
      # deux témoins (formes de liens qu'elle DOIT reconnaître, mentions qu'elle NE DOIT PAS compter)
      # et un plancher de liens résolus sur l'arbre réel, pour ne pas rendre vert en ne voyant rien.
      # UN DOCUMENT AJOUTÉ SANS ENTRÉE D'INDEX FAIT ROUGIR CE PAS, ET C'EST L'OBJET : l'index se tient
      # au moment où le document est écrit, pas lors d'un futur audit.
      - name: Un document suivi doit être ATTEIGNABLE depuis la page d'accueil
        run: python3 .github/scripts/check_every_doc_is_reachable.py

      # `P9.7-b` — CE QU'UN EXPLOITANT DOIT POUVOIR TROUVER EST DOCUMENTÉ. Même famille que le pas
      # précédent, appliquée non plus au FICHIER mais à la SURFACE : le corpus dérive parce que rien
      # ne le lie au code — un levier ajouté, un capteur livré, un onglet posé ne font rougir aucun
      # instrument s'ils ne sont écrits nulle part. MESURÉ SUR L'ARBRE SUIVI le 2026-08-25, avant la
      # campagne `P9.7-a` : sur les 37 onglets que la console DÉCLARE, TROIS avaient une entrée dans
      # le corpus ; les 34 autres n'étaient décrits nulle part. Dans le même temps 39 capteurs sur 39
      # en avaient une — le critère n'est donc pas hors d'atteinte, c'est une part de la surface qui
      # n'avait jamais été relue.
      # LES QUATRE INVENTAIRES SONT DÉRIVÉS, ET LES SOURCES LE SONT AUSSI. Le module de navigation
      # est l'unique fichier de `web/` qui porte la définition `const SPACES = [` ; le script de
      # retrait est l'unique fichier suivi qui porte le `case` validant le mode ; une bibliothèque
      # de capteurs se reconnaît à ce qu'un autre capteur la SOURCE, jamais à son nom. ANCRAGE SUR
      # LA PROPRIÉTÉ, PAS SUR LE NOM (`P11.13-d`) : prouvé par mutation le 2026-08-25 — les trois
      # sources renommées ET déplacées, la garde les retrouve, publie leurs nouveaux chemins, et
      # MORD toujours (37 onglets et 39 capteurs, comptes inchangés) au lieu de verdir en voyant
      # moins de choses à contrôler.
      # DEUX RÉGIMES. Onglets, capteurs et modes : plafond ZÉRO, chacun doit avoir une ENTRÉE — la
      # première cellule d'une ligne de tableau, jamais une simple mention en prose. Leviers
      # `PLUME_*` : plusieurs centaines, dont la majorité n'a d'autre documentation que le code qui
      # les lit — exiger zéro désarmerait la garde, on pose donc un CLIQUET, le nombre non documenté
      # est PUBLIÉ à chaque exécution et ne doit jamais AUGMENTER. Un vert affiche les quatre
      # comptes ; un rouge nomme ce qui manque et où le décrire ; un instrument muet (source de
      # dérivation absente ou dédoublée) REFUSE DE CONCLURE en code 2 au lieu de rendre vert.
      # LE CORPUS QU'ELLE LIT EST CELUI DES FICHIERS SUIVIS, délibérément : un document hors index
      # n'existe pas pour elle comme il n'existe pas pour le lecteur du dépôt.
      - name: Ce qu'un exploitant doit pouvoir trouver est documenté — onglets, capteurs, modes et leviers DÉRIVÉS des sources, cliquet sur ce qui n'est pas couvert (P9.7-b)
        run: python3 .github/scripts/check_operator_surface_is_documented.py

      # `P9.4-b` + `P9.6-a` — UN DÉPLOIEMENT N'ARME JAMAIS UNE TÂCHE DONT UNE PRÉCONDITION MANQUE CHEZ
      # LUI. Cette garde était ÉCRITE et volontairement NON CÂBLÉE : elle sortait en refus, et c'était son
      # verdict JUSTE — les deux déploiements de référence armaient l'ordonnanceur de sauvegarde toutes
      # les 6 h en livrant la clé de base VIDE, si bien qu'aucune archive n'était jamais écrite pendant
      # qu'une rétention était annoncée en toutes lettres à côté, et que l'échec était MUET. Son câblage
      # devait atterrir AVEC la décision, pas avant : c'est `P9.6-a` qui satisfait la précondition sur un
      # déploiement NEUF — une base absente engendre sa clé, la base naît chiffrée, le cycle a de quoi
      # produire. RIEN N'EST ÉNUMÉRÉ : les tâches armées sont dérivées de la FORME du gate dans le démon,
      # les préconditions du point fixe des refus atteignables, les équivalences de variables des TABLEAUX
      # DE CONSTANTES du démon, et les déploiements de tout YAML du dépôt qui arme. Chaque lecture est
      # exercée dans les DEUX sens avant tout verdict, et la garde REFUSE DE CONCLURE (sortie 2) sous ses
      # planchers plutôt que de rendre vert en étant aveugle. Éprouvée par mutation le 2026-08-25 :
      # commenter la précondition du manifeste la fait sortir en refus en NOMMANT le fichier.
      # CE QU'ELLE NE TIENT PAS, et qui est écrit dans son verdict : la justesse d'une valeur non vide,
      # l'aboutissement réel du cycle — dit à l'exécution par le signal non purgeable — et ce qu'un
      # fichier d'environnement d'exploitant ajouterait hors du dépôt.
      - name: Un déploiement n'arme jamais une tâche dont une précondition n'est pas satisfaite chez lui (P9.4-b)
        run: python3 .github/scripts/check_a_deployment_never_arms_a_task_it_cannot_run.py

      # `P8.9-c` — MÊME FAMILLE, APPLIQUÉE À L'INDEX DES CLÉS : ici ce n'est ni la couverture ni le
      # document qui manque, c'est ce que la ligne dit d'ELLE-MÊME. Une clé porte un état, et ✅
      # promet qu'il n'y a plus rien à faire. MESURÉ le 2026-08-23, avant réparation : sur 155 lignes
      # ✅ de `docs/ROADMAP.md`, 20 portaient dans leur propre cellule un énoncé « Reste : » /
      # « Reste ouvert : » / « Résidu nommé : », et 17 de ces énoncés n'étaient ni qualifiés
      # d'assumés, ni renvoyés à une clé, ni déclarés fermés. Le document SAVAIT le travail
      # incomplet et l'affichait comme complet ; qui lisait « ce qui est ouvert » ne voyait pas ces
      # dix-sept-là. La garde n'énumère AUCUNE clé — une garde qui nommerait `P3.2-a` serait morte au
      # prochain ajout : elle reconnaît une FORME que le document se donne à lui-même, le substantif
      # en tête d'énoncé, et laisse passer le verbe conjugué en pleine phrase (« le dépôt reste
      # détecté »), qui la noierait sous les faux positifs. Sous ✅, un tel énoncé doit porter un
      # RENVOI vers une autre clé, une QUALIFICATION (assumé, délibéré, à dessein, hors périmètre,
      # hors de portée), ou une CLÔTURE en majuscules — laquelle ferme aussi les restes qui la
      # précèdent, car ces cellules sont écrites dans l'ordre du temps. Elle porte ses deux témoins
      # sur un corpus fabriqué, refuse de conclure sous ses planchers, et échoue si le vocabulaire du
      # reste disparaît du document plutôt que de rester verte en ne gardant plus rien. Ce qu'elle ne
      # tient pas est écrit : la seule famille lexicale du reste, et aucun dépôt voisin.
      - name: Un reste sous une clé fermée appartient à une clé ouverte, ou se déclare
        run: python3 .github/scripts/check_every_residue_belongs_to_an_open_key.py

      # `P8.9-d` — LA FORME DU TABLEAU, LÀ OÙ LES TROIS GARDES VOISINES NE LISENT QUE SON TEXTE. Mesuré
      # le 2026-08-25 : QUINZE lignes de l'index ne se terminaient pas par la barre qui clôt une cellule,
      # et SOIXANTE-DIX lignes réparties sur trois documents portaient plus de cellules que leur tableau
      # n'en déclare — le rendu IGNORE l'excédent. Sur l'index seul, plus de douze mille caractères
      # n'atteignaient pas la page, dont la clôture entière de TROIS clés fermées, que le lecteur voyait
      # donc comme inachevées. Cause unique et vérifiée sur les 70 : une barre verticale dans le texte
      # d'une cellule, que les accents graves ne protègent PAS. Aucune garde ne le voyait : celle des
      # restes, celle des chiffres publiés et celle des collisions de clés lisent le TEXTE des cellules.
      # LE CRITÈRE EST DÉRIVÉ DU DOCUMENT LUI-MÊME : la LIGNE DE DÉLIMITATION d'un tableau est la
      # déclaration que ce tableau fait de sa propre forme — nombre de colonnes, style de barres — et
      # toute ligne de son corps doit la porter. Rien n'est écrit à la main, ni « quatre cellules » ni un
      # nom de fichier (`P11.13-d`). Le corpus est aussi une PROPRIÉTÉ : tout document Markdown qui
      # DÉCLARE un tableau, suivi ou seulement présent, pour qu'un document neuf soit jugé AVANT d'être
      # indexé et non le jour où il est publié. Elle refuse de conclure (code 2) sous ses planchers ou si
      # son découpeur ne se reconnaît plus, et dit ce qu'elle ne tient pas : la forme seulement, jamais le
      # texte, et pas les tableaux montrés dans un bloc de code, qui sont des échantillons.
      - name: Une ligne de tableau porte la forme que son en-tête déclare (P8.9-d)
        run: python3 .github/scripts/check_every_table_row_carries_the_shape_its_header_declares.py

      # `P8.9-g` — UNE CLÉ NEUVE S'AJOUTE À LA FIN DU DOCUMENT, QUI N'EST PAS LA FIN DE SA PHASE. Mesuré
      # le 2026-08-26 : vingt clés sur deux cent quatre-vingts se lisaient sous le titre de la console,
      # dont neuf d'une phase qui n'avait AUCUNE section. Un lecteur cherchant la phase ne trouvait rien,
      # un lecteur lisant la console y trouvait de la sauvegarde. La garde DÉRIVE la section attendue de
      # la clé elle-même — aucune phase n'est énumérée ici, en ajouter une n'oblige à rien toucher — et
      # elle refuse de conclure si son propre instrument échoue à ses témoins ou si le corpus est vide.
      - name: Une clé se lit sous le titre de sa phase (P8.9-g)
        run: python3 .github/scripts/check_every_key_sits_under_the_section_of_its_phase.py

      # `P8.9-f` — L'INDEX ET LES COMMITS POUVAIENT SE CONTREDIRE SANS QUE RIEN NE LE DISE. Deux fois
      # le 2026-08-25, des clés commitées, déployées et VÉRIFIÉES EN PRODUCTION figuraient encore
      # parmi les clés OUVERTES : qui lit « ce qui est ouvert » ne voyait pas ce qui est fait. Cette
      # garde compare ce qu'un commit AFFIRME fermer à ce que l'index DÉCLARE, sans énumérer ni clé ni
      # fichier — le vocabulaire de fermeture est DÉRIVÉ des déclarations datées de l'index, et une
      # famille impure est REJETÉE (« déployé » n'est pas « fermé »). La fermeture doit SUIVRE le
      # groupe de clés : le critère « même ligne » accuserait six clés ouvertes à tort.
      # ELLE NE FERME PAS LA CLÉ QUI LA FONDE, ET ELLE LE DIT LA PREMIÈRE : rejouée sur l'arbre
      # d'avant chacun des deux incidents, elle rend ZÉRO les deux fois. Deux causes MESURÉES, dont
      # une qui vaut au-delà d'ici : un lexique dérivé de l'usage n'admet une famille qu'après
      # plusieurs déclarations déjà posées, donc **la PREMIÈRE fermeture écrite avec un mot neuf est
      # toujours manquée**. Les deux remèdes évidents ont été RÉFUTÉS par la mesure — dériver aussi du
      # vocabulaire des commits ajoute vingt familles dont dix-huit ne ferment rien et deux
      # accusations FAUSSES pour zéro légitime ; exiger la convention en amont refuserait
      # quatre-vingt-neuf commits de fermeture sur cent-dix, et ne dirait rien d'une bascule ABSENTE,
      # qui est justement le défaut. Elle refuse de conclure (code 2) sous ses planchers.
      - name: L'index concorde avec ce qu'un commit déclare fermé — posée sous P8.9-f, qu'elle ne ferme pas
        run: python3 .github/scripts/check_the_index_agrees_with_what_a_commit_closes.py

      # MÊME FAMILLE, APPLIQUÉE AU PLAN DES MODULES : un document que rien ne relit dérive. Le plan
      # (`docs/MODULE-MAP.md`) nommait encore `idp.rs` et `compliance.rs` alors que l'un était devenu
      # un répertoire et l'autre n'avait jamais vécu qu'en handler, et un module de premier niveau sur
      # trois n'y avait aucune entrée (mesuré le 2026-08-22 : 2 chemins absents, 26 modules sans
      # entrée sur 79). La garde n'énumère aucun répertoire : elle lit la ligne `Scope:` du plan, puis
      # relit dans les DEUX sens — tout chemin cité en première cellule d'un tableau du périmètre
      # existe dans l'arbre SUIVI, et tout module de premier niveau du périmètre a une entrée. Elle
      # porte ses témoins, un plancher d'entrées, et refuse de conclure si `git ls-files` se tait.
      # LE PÉRIMÈTRE COUVRE AUSSI LA CONSOLE. Le plan ne tenait que le démon ; `web/`, la moitié du
      # produit et le tronc d'où sont extraits ses modules, n'était relu par rien. Mesuré sur l'arbre
      # suivi le 2026-08-23 : 47 modules `web/*.js`, zéro cité dans le plan. Chaque poste du périmètre
      # DÉCLARE désormais l'extension qui y fait un module (`` `daemon/src/` (`*.rs`), `web/` (`*.js`)
      # ``) : ce qu'est un module dépend du langage de l'arbre, et une garde qui supposait `.rs` ne
      # pouvait tenir que la moitié du produit. Le corpus témoin porte les deux langages.
      - name: Le plan des modules dit vrai sur l'arbre suivi, dans les deux sens — démon ET console (P7.18-a)
        run: python3 .github/scripts/check_module_map_matches_tree.py

      # MÊME FAMILLE, APPLIQUÉE À LA PROMESSE CENTRALE DU PRODUIT : une garantie AFFIRMÉE que le code
      # ne tient que par convention. La livraison au moins une fois repose sur « écrire un temporaire
      # puis renommer ». Ce motif donne l'ATOMICITÉ DU CONTENU et rien d'autre : après une coupure,
      # l'entrée de répertoire peut manquer alors que le fichier existe — les octets sont là, leur NOM
      # n'y est pas, et `ship.sh` parcourt le spool PAR NOM. MESURÉ le 2026-08-20 : aucune
      # synchronisation nulle part, et le motif recopié à la main dans SEPT capteurs en plus de la
      # bibliothèque. Coût de la correction, mesuré le même jour (NVMe, 100 publications) : +12,7 ms
      # par publication en shell — payable pour un capteur cadencé à la minute, et dit comme tel.
      # La garde n'énumère aucun capteur : elle refuse toute publication dans `$SPOOL` écrite hors de
      # `spool_write`/`spool_publish_file`, puis SOURCE la bibliothèque avec un `sync` instrumenté et
      # vérifie l'ORDRE réel (contenu AVANT le renommage, répertoire APRÈS). Elle dit aussi ce qu'elle
      # ne prouve pas : que les appels sont faits, jamais la survie à une coupure d'alimentation.
      - name: Une publication dans le spool doit être DURABLE, pas seulement atomique
        run: python3 .github/scripts/check_publication_is_durable.py

      # LE DÉFAUT VOISIN, ET PLUS GRAVE : la garde ci-dessus rend DURABLE ce qui est publié ; celle-ci
      # refuse qu'un capteur ACQUITTE ce qu'il n'a pas encore publié. Un capteur incrémental marque sa
      # progression (filigrane, offset, curseur, repère daté, registre « déjà signalé », base de
      # référence) ; marquer AVANT de publier rend le marqueur menteur — une coupure entre les deux
      # perd les événements, et rien ne le signale, puisque le marqueur affirme qu'ils sont acquittés.
      # Aucune synchronisation n'y remédie : c'est l'ORDRE. `S27` annonçait CINQ capteurs fautifs ; le
      # compte venait d'un `grep state_write`, pas du motif. Recherche refaite sur le MOTIF le
      # 2026-08-20 : DIX-SEPT — les douze manquants marquaient par redirection brute, par `touch` d'un
      # repère relu en `find -newer`, par ajout dans un registre, par renommage d'une base de
      # référence, ou via un point de reprise avancé par un outil externe au moment de la lecture.
      # La garde n'énumère aucun capteur : elle refuse toute écriture directe de marqueur hors de la
      # bibliothèque (un capteur MET EN ATTENTE, il n'a pas le geste d'écrire), puis SOURCE la
      # bibliothèque et vérifie l'ORDRE réel, et enfin SIMULE une coupure entre les deux gestes :
      # l'enveloppe publiée doit être là et le marqueur absent — donc rejeu, jamais perte. Elle dit
      # aussi ce qu'elle ne prouve pas : que le rejeu soit sans conséquence (sept capteurs n'ont
      # aucune clé de dédoublonnage, leurs doublons seront VISIBLES) ni la survie à une coupure
      # d'alimentation.
      - name: Un filigrane doit SUIVRE la publication qu'il acquitte, jamais la précéder
        run: python3 .github/scripts/check_watermark_follows_publication.py

      # LA MOITIÉ MANQUANTE DE LA GARDE PRÉCÉDENTE. Publier avant d'acquitter transforme une perte
      # SILENCIEUSE en rejeu VISIBLE — c'est un progrès, et il est incomplet : le central n'absorbe ce
      # rejeu que si l'événement PORTE de quoi être reconnu. Le mécanisme est unique et il se dérive :
      # `event.dedup` porte un index UNIQUE, toute écriture est un `INSERT OR IGNORE`, la clé est
      # cloisonnée par l'hôte au point d'écriture, et une clé ABSENTE vaut NULL — or SQLite tient deux
      # NULL pour DISTINCTS, donc sans clé il n'y a pas de dédoublonnage du tout. Le décompte annoncé
      # (six / quatre / sept) portait sur DIX-SEPT capteurs parce qu'il avait hérité de la liste de
      # `S30`, celle des capteurs dont l'ORDRE était fautif ; la population qui REJOUE en compte
      # VINGT-DEUX (mesuré le 2026-08-21) — `web`, `mail`, `dataaccess` et `resources` avaient déjà le
      # bon ordre et rejouent tout autant. La garde n'énumère aucun capteur : elle refuse tout objet
      # événement sans clé chez un capteur qui publie-puis-acquitte, puis LANCE VRAIMENT sept capteurs
      # avec une coupure simulée juste après la publication et exige trois choses — la tranche
      # republiée rend les MÊMES clés, des enregistrements DIFFÉRENTS n'en partagent aucune (sans ce
      # témoin-là, une clé constante passerait le premier en effaçant toutes les données), et un
      # enregistrement neuf ne réemploie jamais une clé déjà vue. L'horloge est décalée entre les
      # passes, faute de quoi elles tomberaient dans la même seconde et une clé bâtie sur l'instant de
      # publication paraîtrait stable.
      - name: Un rejeu doit être ABSORBÉ par le central, pas seulement visible
        run: python3 .github/scripts/check_replay_is_absorbable.py

      # LA MÊME FAMILLE, PAR LA PORTE DE SORTIE — et c'est un défaut de CORRECTION, pas un oubli.
      # `S30` a posé « publier d'abord, acquitter ensuite » en s'appuyant sur une hypothèse ÉCRITE :
      # « sortir par la porte propre veut dire qu'aucune enveloppe n'a été publiée, donc rien n'est
      # acquitté ». Vraie pour un curseur CALCULÉ À PARTIR de ce qui a été lu (il n'existe pas tant
      # que la lecture n'a pas abouti) ; FAUSSE pour un marqueur qui ne doit rien à la lecture — un
      # offset pris sur la TAILLE du fichier, un repère daté, l'instant du passage. La lecture échoue,
      # le capteur n'a effectivement rien à signaler, il sort par la porte propre, et cette sortie
      # ACQUITTE une tranche jamais publiée : la perte silencieuse que `S30` fermait, revenue par la
      # sortie. Ce qui la rend invisible : le mot d'une lecture ratée et celui d'une source calme sont
      # le MÊME mot — la chaîne vide — et un `| grep` derrière la lecture remplace son code de retour
      # par le sien, pour qui « rien trouvé » vaut 1, c'est-à-dire le cas NORMAL.
      # MESURÉ le 2026-08-21 sur la PROPRIÉTÉ, pas sur un symbole : 22 capteurs mettent un marqueur en
      # attente ; NEUF pouvaient acquitter une lecture ratée par la sortie propre (falco, suricata,
      # auditd, kube-audit, audit, clamav, yara, cloudflare-http, integrity) et QUATRE par une
      # publication inconditionnelle (ufw, portscan, origin-drop, pod-logs).
      # La garde n'énumère aucun capteur : elle découvre la population sur le motif, exige de chacun
      # l'une des DEUX preuves (nommer le chemin d'échec de lecture, ou ne mettre en attente que sur
      # le chemin qui publie), puis LANCE de vrais capteurs avec la lecture relayée pour qu'elle
      # échoue. Deux témoins en sens inverse, et le second est le cœur : lecture en échec -> marqueur
      # figé, aveu émis, tranche rejouée ; source LUE sans rien à signaler -> marqueur écrit et aucun
      # aveu, sans quoi on aurait troqué une perte silencieuse contre un rejeu permanent.
      - name: Une lecture qui ÉCHOUE ne doit rien acquitter
        run: python3 .github/scripts/check_read_failure_is_not_acknowledged.py

      # `P4.1-q` — LA MÊME FAMILLE, MAIS RIEN N'EST PUBLIÉ DU TOUT. `S32`/`S33`/`S36` ferment le cas
      # où un chiffre RASSURANT part quand même. Ici la détection s'ÉTEINT : un repli d'erreur du
      # parcours qui pose les watches d'intégrité abandonne la branche courante, un SOUS-ARBRE ENTIER
      # sort de la surveillance — aucun événement, aucun avertissement, aucun aveu — et `fim_mode`
      # continue d'annoncer « realtime » pendant que la couverture annoncée reste celle de la
      # configuration. Le même défaut existe du côté de la SURFACE : la commande d'état enveloppait
      # ses lignes dans des `if let Ok(…)` sans `else`, si bien qu'une configuration illisible faisait
      # DISPARAÎTRE la profondeur de file au lieu de la dire inconnue — et une ligne absente se lit
      # comme une absence de problème.
      # CE QUI REND LE DÉFAUT INVISIBLE À LA RELECTURE : la forme fautive est la forme IDIOMATIQUE de
      # Rust — `Err(_) => continue`, `if let Ok(x) = …` sans `else`, `entries.flatten()`. Aucune de
      # ces lignes ne ressemble à une perte.
      # MESURÉ le 2026-08-21 sur la PROPRIÉTÉ (une branche d'échec qui ABANDONNE sans laisser de
      # trace), pas sur un symbole : 8 fonctions posent ou énumèrent de la surveillance, 5 écrivent la
      # surface d'état, et SEIZE sites étaient muets — onze dans le backend Linux, trois grandeurs
      # effacées dans la commande d'état, deux dans le backend Windows. Le constat d'origine en
      # annonçait TROIS et ne voyait pas Windows : il est réfuté par cette mesure. Hors du crate
      # `agent`, le même critère en mesure 32 de plus : ils ne sont pas exigés ici, et c'est écrit.
      # La garde n'énumère ni fichier ni symbole : la population de couverture est dérivée du CONTRAT
      # `FimBackend` (la méthode qui POSE) et de l'énumération de répertoire, celle de la surface de
      # l'écriture sur la sortie standard. Elle valide son propre instrument sur sept témoins en SENS
      # INVERSE — dont la pose DÉGÉNÉRÉE qui ne surveille plus rien, et un scrutin sous bloc `unsafe`
      # qu'une lecture naïve des accolades ne voit pas.
      - name: Une couverture qu'on n'a pas pu poser ne s'éteint pas en silence
        run: python3 .github/scripts/check_coverage_loss_is_never_silent.py

      # DU CODE LIVRÉ QU'AUCUN JOB NE COMPILE (`P8.24-a`). Une fonctionnalité cargo éteinte par défaut
      # met du code derrière un `cfg` que seule une commande `--features` rend vrai ; si aucune
      # commande bloquante de la CI ne l'active, une régression de compilation y passe au VERT. MESURÉ
      # le 2026-08-21 sur les QUATRE manifestes : 9 fonctionnalités déclarées, 8 compilées — l'écart
      # était exactement `fim_windows_native` (agent), prouvé par mutation (`cargo xwin check` : une
      # erreur de type sous ce `cfg` rend 101 avec la fonctionnalité, 0 sans). Le constat tenait pour
      # ce qu'il annonçait : il ne cachait pas un écart plus large. Même famille que `S36`.
      # La garde n'énumère ni fonctionnalité ni job : elle DÉRIVE un côté des manifestes `Cargo.toml`
      # (parseur TOML, dépendances optionnelles implicites comprises) et l'autre des blocs `run:` de
      # TOUS les workflows (recettes `make` suivies ; étapes consultatives ou conditionnelles exclues
      # — elles ne gardent rien), et REFUSE l'écart. Elle refuse aussi de CONCLURE sous un plancher de
      # population ou devant un `--features $VAR` qu'elle ne sait pas résoudre, et elle valide son
      # instrument sur des témoins dans les deux sens avant tout verdict. Une exception doit porter
      # sa raison et sa condition de levée, et pourrit si sa fonctionnalité disparaît ou se compile.
      # `yaml` vient du paquet de la distribution (signé par apt), jamais de pip.
      - name: Toute fonctionnalité cargo déclarée est compilée par un job bloquant
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          python3 .github/scripts/check_every_feature_is_compiled_somewhere.py

      # `P7.17-a` — UN CHIFFRE D'EXPLOITATION NE SE PUBLIE PAS (AGENTS.md §4). Un chiffre de CONCEPTION (un
      # plafond, une borne, un ordre de grandeur qui décrit le produit) se publie ; un chiffre RELEVÉ sur
      # une installation (taille de base, débit, compteur, horodatage d'incident, nom d'objet) renseigne
      # sur une cible et n'apprend rien au lecteur du code. La roadmap publique avait été expurgée, pas
      # les commentaires ni la documentation : un filtre grossier en rendait déjà des dizaines. Ce qui
      # sépare les deux classes est L'OBJET MESURÉ — le produit (banc, harnais, arbre, suite) ou une
      # installation — et la garde ne lit pas une liste de mots : elle reconnaît la FORME d'un relevé
      # (une grandeur attribuée à une installation réelle ; un volume daté sans contexte de banc ou
      # d'arbre déclaré ; un hôte sous le domaine de l'éditeur, DÉRIVÉ de l'identité canonique ; un objet
      # Kubernetes nommé). La règle d'écriture qu'elle tient : « tout chiffre daté dit d'où il vient ».
      # Elle valide son instrument dans les deux sens avant tout verdict, refuse de conclure sous ses
      # planchers, et dit ce qu'elle ne voit pas : un relevé sans forme reconnaissable, les fichiers de
      # données, et l'historique déjà poussé — elle tient la version servie, pas le passé.
      - name: Un chiffre d'exploitation ne se publie pas (AGENTS.md §4)
        run: python3 .github/scripts/check_no_operational_figure_is_published.py

      # Discovery is by EXTENSION **and** by first-line SHEBANG, deliberately: today all 43
      # tracked scripts carry a `.sh` extension (measured), and 42 of them a sh/bash shebang —
      # the odd one out is `collectors/lib.sh`, a SOURCED library with no shebang, which the
      # extension glob catches. The shebang sweep is what stops a future extensionless
      # `collectors/foo` from being ingested into production while invisible to this gate.
      # Only the FIRST line counts (`head -1`): matching `^#!` anywhere would drag in Rust
      # files that merely embed a shebang inside a string or heredoc.
      #
      # MIN_SCRIPTS is a FLOOR, not the exact-count invariant used for the Rust suites: adding
      # collectors is routine and must not require touching this file. The floor exists to make
      # the real failure mode impossible — a broken glob or a rename that leaves the loop with
      # ZERO files would otherwise report a cheerful green "all scripts pass".
      - name: bash -n — every tracked shell script must parse
        env:
          MIN_SCRIPTS: "43"
        run: |
          set -euo pipefail
          mapfile -t files < <(
            {
              git ls-files '*.sh' '*.bash'
              git ls-files | while IFS= read -r f; do
                [ -f "$f" ] || continue
                head -1 "$f" 2>/dev/null | grep -qE '^#!.*/(env +)?(ba)?sh( |$)|^#!.*/(ba)?sh$' && printf '%s\n' "$f"
              done
            } | sort -u
          )
          echo "tracked shell scripts discovered: ${#files[@]} (floor: $MIN_SCRIPTS)"
          if [ "${#files[@]}" -lt "$MIN_SCRIPTS" ]; then
            echo "::error::discovered only ${#files[@]} shell scripts, floor is $MIN_SCRIPTS."
            echo "::error::Either discovery broke (this gate would be checking nothing), or scripts were"
            echo "::error::legitimately removed — in that case lower MIN_SCRIPTS here, from your own count."
            exit 1
          fi
          rc=0
          for f in "${files[@]}"; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n: syntax error"
              rc=1
            fi
          done
          # NB: plain `if`, not `[ ... ] && echo` — under `set -e` a false `[ ... ]` at the end of
          # an && list aborts the script, which would exit non-zero for the right reason by pure
          # accident. Be explicit instead.
          if [ "$rc" -eq 0 ]; then echo "all ${#files[@]} scripts parse."; fi
          exit "$rc"

      # shellcheck is CONSULTATIVE (continue-on-error) and stays that way until someone
      # measures the tree clean against it. It is NOT hardcoded as a blocking gate because
      # that claim was never verified: shellcheck is absent from the machine these scripts
      # were checked on, so the number of findings on this tree is NOT MEASURED. Promoting it
      # to blocking on a guess would either wedge CI on day one or, worse, be quietly deleted
      # by the next person it inconveniences. Measure first, then drop continue-on-error.
      # (`shellcheck` ships preinstalled on the ubuntu-24.04 runner image; `|| true` on the
      # install line keeps this step from failing the job if that ever stops being true —
      # consistent with it being advisory.)
      - name: shellcheck (CONSULTATIVE — advisory only, not a gate)
        continue-on-error: true
        run: |
          set -uo pipefail
          command -v shellcheck >/dev/null 2>&1 || sudo apt-get install -y shellcheck || true
          command -v shellcheck >/dev/null 2>&1 || { echo "shellcheck unavailable — skipping (advisory step)"; exit 0; }
          shellcheck --version
          # shellcheck -x follows `source`d files (collectors/lib.sh); -S style keeps output complete.
          git ls-files '*.sh' '*.bash' | xargs -r shellcheck -x -S style || true

  # ---------------------------------------------------------------------------
  # features — COMPILE-CHECK EVERY OFF-BY-DEFAULT FEATURE.
  #
  # WHY: gated code that nothing compiles ROTS. `cold_tier` proved it (see that job: it was
  # already red on main). These features are the rest of the OFF-by-default surface; each gets
  # a `cargo check` so a refactor of shared code cannot silently break a backend nobody builds.
  #
  # WHAT THIS DOES NOT DO — stated plainly so a green tick is not over-read: `cargo check` is
  # TYPE-CHECKING ONLY. It does not link, does not run a single test, and proves NOTHING about
  # behaviour. `saml`, `ldap`, `ai`, `clickhouse` and `clickhouse-ha` have NO executed CI
  # coverage whatsoever. A logic regression in the SAML assertion validator, the LDAP bind, the
  # AI advisory path or the ClickHouse backend WILL pass this pipeline green.
  # Making that real requires test suites runnable without a live IdP / directory / model
  # endpoint / ClickHouse server — that work is NOT done and is not claimed here.
  #
  # Each feature is checked SEPARATELY, not as one combined `--features a,b,c`: features are
  # additive, so a combined check can hide a feature that only fails on its own (e.g. one that
  # relies on an import another feature happens to bring in).
  # ---------------------------------------------------------------------------
  features:
    name: features (cargo check per off-by-default feature)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout plume
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # @stable (no semver tags; pinned to stable branch commit)
        with:
          toolchain: "1.96.0"

      - name: Cache cargo (registry + target)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: cargo-features-${{ runner.os }}-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            cargo-features-${{ runner.os }}-

      # `ai` — pure compile feature (no new crate; enables guatx-core/ai). Cheapest of the set.
      - name: cargo check --features ai (advisory NL->SOQL)
        working-directory: daemon
        run: cargo check --features ai --locked --verbose

      # `ldap` — pulls ldap3 (pure-Rust, tokio-rustls).
      - name: cargo check --features ldap (LDAP/AD bind)
        working-directory: daemon
        run: cargo check --features ldap --locked --verbose

      # `saml` — pulls samlify/saml-rs/bergshamra (pure-Rust, RustCrypto).
      - name: cargo check --features saml (SAML 2.0 SP)
        working-directory: daemon
        run: cargo check --features saml --locked --verbose

      # `clickhouse` — scale-out cold backend (pure-Rust async HTTP client).
      - name: cargo check --features clickhouse (scale-out tier)
        working-directory: daemon
        run: cargo check --features clickhouse --locked --verbose

      # `clickhouse-ha` — INERT SCAFFOLD, superset of `clickhouse`. It is not activated by
      # `--features clickhouse`, so it needs its own check or it would compile nowhere.
      - name: cargo check --features clickhouse-ha (distributed scaffold)
        working-directory: daemon
        run: cargo check --features clickhouse-ha --locked --verbose

      # `duckdb` — EXPERIMENTAL warm tier. Moved here from the `test` job (same command).
      # Un-bundled: `--features duckdb` LINKS a system libduckdb. `cargo check` does not link,
      # which is precisely why this is a `check` and not a `build` — it validates the Rust side
      # without requiring libduckdb on the runner.
      - name: cargo check --features duckdb (warm tier)
        working-directory: daemon
        run: cargo check --features duckdb --locked --verbose

      # `s3_backup` — object-storage sink of the backup scheduler. Adds ZERO crates to the graph
      # (SigV4 is HMAC-SHA256 + SHA-256, both already in `util::hexcrypto`; the transport reuses
      # `util::http_client` and the rustls/ring roots already linked).
      - name: cargo check --features s3_backup (sink objet de sauvegarde)
        working-directory: daemon
        run: cargo check --features s3_backup --locked --verbose

      # ...AND THEN ACTUALLY RUN ITS TESTS. A `cargo check` proves the feature compiles; it proves
      # NOTHING about the property this module exists for — that a failed upload can never come back
      # as a success. Four of its tests script a local fake object service into answering the exact
      # ways an upload can go wrong (refusal, silent close, a re-read that reports a DIFFERENT size,
      # nothing listening), and each asserts the verdict is not a deposit. Those are the tests whose
      # absence would be expensive, so they run here rather than only on a contributor's machine.
      #
      # FILTERED ON PURPOSE. `cargo test --features s3_backup` alone would also re-run the whole
      # default suite on this runner — the same work the `test` job already does, for no added
      # signal. The name filter keeps only what the feature adds; the test-binary build (the
      # expensive part) is shared with the `cargo check` step above via the same target dir.
      #
      # THE COUNT IS ASSERTED, like every other suite in this file, with its OWN counter. Same awk,
      # same failure mode. A feature-gated test that silently stopped being compiled would otherwise
      # leave this step cheerfully green on zero tests — which is exactly the shape of rot the
      # cold-tier job's anti-no-op check was added to catch.
      - name: cargo test --features s3_backup (tests du sink objet) + assert the count
        working-directory: daemon
        env:
          # MESURÉ le 2026-08-19 (`cargo test --offline --locked --features s3_backup sink_s3_`,
          # rc=0, 1,82 s de suite filtrée). Ce compte est celui des tests que la FEATURE ajoute ; il
          # est indépendant de EXPECTED_TESTS et n'a pas à bouger quand la suite par défaut bouge.
          # La feature n'ajoute AUCUN test à la suite par défaut — vérifié par ÉNUMÉRATION le même
          # jour (`-- --list` avec et sans la feature : l'écart vaut exactement ce nombre, et les
          # noms de l'écart sont tous ceux de `tests/sink_s3.rs`).
          EXPECTED_S3_TESTS: "12"
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP/plume-tmp-s3"
          rm -rf "$TMPDIR"; mkdir -p "$TMPDIR"
          cargo test --features s3_backup --locked --verbose sink_s3_ 2>&1 | tee /tmp/s3-tests.log
          total=$(awk '/^test result: ok\. [0-9]+ passed/{s+=$4} END{print s+0}' /tmp/s3-tests.log)
          echo "s3_backup tests passed: $total (expected $EXPECTED_S3_TESTS)"
          if [ "$total" != "$EXPECTED_S3_TESTS" ]; then
            echo "::error::s3_backup suite test count is $total, expected $EXPECTED_S3_TESTS."
            echo "::error::If the change legitimately adds or removes s3_backup tests, update"
            echo "::error::EXPECTED_S3_TESTS HERE, from your own measurement — and nowhere else."
            exit 1
          fi
          if [ "$total" -eq 0 ]; then
            echo "::error::zero test ran: the filter or the feature gate stopped matching — this step is a no-op."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # security — supply-chain + secret hygiene. Independent gate: runs in parallel with
  # the test job and never gates its logic. Two checks:
  #   1) cargo-audit — RustSec advisory scan of the daemon crate's locked dep tree
  #      (--deny warnings => unmaintained/yanked/vuln advisories FAIL the job). Reads
  #      daemon/Cargo.lock only (the patched path dep guatx-core is skipped — no build,
  #      no core checkout needed).
  #   2) gitleaks   — secret scan of the tree + history. An ephemeral config (written
  #      below, NOT committed) extends the default ruleset and ALLOWLISTS the two
  #      documented unit-test PEM fixtures (daemon/src/idp.rs OIDC test key,
  #      daemon/src/tests/saml.rs SAML test key/cert — non-secret by design) so the scan
  #      flags REAL leaks without false-positiving on the test keys.
  # ---------------------------------------------------------------------------
  security:
    name: security (cargo-audit + gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout plume
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0   # full history so gitleaks can scan past commits, not just the tip.

      # AVANT gitleaks, et pour cause : un octet NUL dans un fichier suivi le fait classer en
      # `data`, et `grep` SANS `-a` le saute EN SILENCE. Mesuré dans le dépôt frère `forge` —
      # un NUL dans un commentaire de code, et grep y trouvait 0 occurrence d'un motif présent
      # 9 fois : un secret déposé là n'aurait été vu par personne. La garde n'énumère aucun
      # fichier : elle exige que TOUT fichier suivi porteur d'un NUL soit déclaré binaire dans
      # `.gitattributes` — donc un fichier ajouté demain est couvert par construction — et que
      # la déclaration reste étroite, pour qu'un `*.rs binary` ne la désarme pas d'une ligne.
      - name: Aucun octet NUL non déclaré (sinon les scans de secrets sautent le fichier)
        run: python3 .github/scripts/check_no_stray_nul.py

      - name: Setup Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # @stable (no semver tags; pinned to stable branch commit)
        with:
          toolchain: "1.96.0"

      # VERSION ÉPINGLÉE — et c'est le point, pas un détail. `cargo install cargo-audit --locked`
      # SANS `--version` installe « la dernière publiée du jour », donc le verdict de cette porte
      # pouvait changer sans qu'une ligne du dépôt ait bougé : une release amont suffisait.
      #
      # Le mode de panne à connaître est un ÉCHEC AU CHARGEMENT, pas un findings de plus. `--locked`
      # fait construire cargo-audit avec SON Cargo.lock, donc avec une version FIGÉE de la crate
      # `cvss` qui analyse les scores de la base d'avis. Mesuré le 2026-08-19 (Cargo.lock des .crate
      # publiés) : cargo-audit 0.21.2 verrouille cvss 2.0.0, dont `src/` n'a QUE le module `v3` ;
      # cvss 2.1.0+ ajoute `v4`, et 0.22.0/0.22.1/0.22.2 verrouillent tous cvss 2.2.0. Face à une
      # advisory notée en CVSS 4.0 — RUSTSEC-2026-0066 (astral-tokio-tar), entrée dans la base le
      # 2026-03-17 — cvss 2.0.0 rend `unsupported CVSS version: 4.0` PENDANT le chargement de la
      # base : l'outil n'atteint alors NI la liste d'ignore de daemon/.cargo/audit.toml NI le scan,
      # et aucun correctif de vulnérabilité ne peut rendre ce job vert. 0.22.2 charge les 1217
      # advisories et scanne les 541 deps (mesuré).
      #
      # POUR RELEVER cette version, deux conditions à VÉRIFIER, pas à supposer :
      #   1. le Cargo.lock de la release visée épingle cvss >= 2.1.0 (sinon retour du même mur) ;
      #   2. son `rust-version` est <= la toolchain épinglée ci-dessus (0.22.2 exige 1.88 ; 1.96.0 OK).
      #
      # La base d'avis (advisory-db), elle, n'est VOLONTAIREMENT pas épinglée : la figer rendrait
      # cette porte aveugle à toute advisory publiée après la révision choisie — ce serait désarmer
      # le contrôle. On épingle l'OUTIL (son comportement doit être reproductible), pas la BASE
      # (son contenu doit être frais).
      - name: Install cargo-audit (version épinglée — lit le CVSS 4.0)
        run: cargo install cargo-audit --locked --version 0.22.2

      # `--deny warnings` = unmaintained/unsound/yanked/vuln advisories FAIL the job. The TLS/crypto
      # advisory cluster (ring 0.16, rustls 0.21, rustls-webpki 0.101, rustls-pemfile 1.0 — RUSTSEC-2025-0009/
      # -0010, -2026-0098/-0099/-0104, -2025-0134) and the anyhow unsound-downcast (RUSTSEC-2026-0190) were
      # FIXED BY UPDATE (ldap3 0.11->0.12 pulls the patched rustls 0.23/ring 0.17 stack; anyhow -> 1.0.104) —
      # NOT ignored; so was the h2 unbounded-empty-DATA-frames advisory (RUSTSEC-2026-0258, h2 0.4.15 ->
      # 0.4.16 via `cargo update -p h2`, transitive through hyper). The accepted advisories with no
      # fix-by-update live in daemon/.cargo/audit.toml
      # (family convention, cf forge console/.cargo/audit.toml) — read automatically by cargo-audit from
      # working-directory: daemon. Each is transitive/build-time or off-by-default and justified there:
      #
      #   RUSTSEC-2023-0071 (rsa 0.9.x, "Marvin" RSA-decryption timing side-channel) — NO patched rsa release
      #     exists. Enters ONLY via the off-by-default `saml` feature (samlify->bergshamra XML-DSig). Plume uses
      #     RSA solely to (a) VERIFY IdP assertion signatures (finish_sso, public-key op — no secret) and
      #     (b) SIGN outbound AuthnRequests (private-key SIGNING, not decryption). It NEVER performs RSA
      #     private-key DECRYPTION of attacker-supplied ciphertext (no EncryptedAssertion handling) -> no
      #     Marvin decryption oracle is exposed. Not applicable.
      #   RUSTSEC-2024-0436 (paste 1.0.15, unmaintained) — build-time proc-macro, transitive via the
      #     off-by-default clickhouse/parquet(cold_tier) deps. No maintained drop-in successor; compile-time
      #     only, no runtime attack surface. No fix available.
      #   RUSTSEC-2026-0173 (proc-macro-error2 2.0.1, unmaintained) — build-time proc-macro, transitive via
      #     age -> i18n-embed-fl. Compile-time only, no runtime surface. No fix available.
      #   RUSTSEC-2024-0320 (yaml-rust 0.4.5, unmaintained) — direct dep, used ONLY by the Sigma-rule importer
      #     front-end (YAML -> serde_json::Value) on operator-supplied rule files. "Unmaintained" != vulnerable;
      #     the successor `yaml-rust2` is a DIFFERENT crate (API break, migration risk to the whole default suite),
      #     so there is no in-place fix-by-update. Revisit if a real yaml-rust CVE lands.
      #   RUSTSEC-2026-0235 (rkyv 0.7.46, insufficient archive validation -> OOB reads on Rc/Arc archives) —
      #     the announced fix is >=0.8.17, which is UNREACHABLE by update: rust_decimal, up to and including
      #     its latest release 1.42.1, declares `rkyv = "^0.7.46"` as its NORMAL optional dep (0.8 is only a
      #     dev-dependency there), and 0.7.46 is the last 0.7.x — so `cargo update -p rkyv --precise 0.8.17`
      #     hard-fails on that requirement. Chain measured 2026-08-19: plume-daemon -> duckdb (off-by-default
      #     feature) -> rust_decimal -> rkyv. Real surface is NIL: nobody enables rust_decimal's `rkyv`
      #     feature (its defaults are serde+std, duckdb takes it with `features = []`), and
      #     `cargo tree -i rkyv --all-features` prints "nothing to print" — rkyv is never compiled or
      #     linked, it exists only as a Cargo.lock entry that cargo-audit scans. Lift when rust_decimal
      #     moves its normal dep to rkyv 0.8.
      - name: cargo audit (daemon crate — deny warnings)
        working-directory: daemon
        run: cargo audit --deny warnings

      # Ephemeral gitleaks config (runner-only, never committed) — extends defaults +
      # allowlists the documented unit-test PEM fixtures so they cannot false-positive.
      - name: Write gitleaks config (allowlist documented test PEM fixtures + env-ref/placeholder paths + schema-rebrand SQL)
        run: |
          cat > "$GITHUB_WORKSPACE/.gitleaks-ci.toml" <<'EOF'
          title = "plume CI gitleaks config"
          [extend]
          useDefault = true
          [allowlist]
          description = "Documented unit-test PEM fixtures, shell env-var references, documented test placeholders and the schema-rebrand SQL — non-secret by design."
          # LINE-scoped allowlist. Production source files are NEVER excluded wholesale: a real secret introduced
          # in `main.rs`, in `migrate.rs` or in any collector must still trip the scan. Each regex below suppresses
          # one PRECISE non-secret shape:
          #   1. the rebrand migration SQL — `REPLACE(query,'key=soc_creds','key=plume_creds')` and its siblings —
          #      which the generic-api-key rule reads as a credential; it is a panel-query key rename.
          #   2. shell references to environment variables in the collectors (`-u "${PLUME_USER:?}:${PLUME_PASS:?}"`,
          #      `Authorization: Bearer $PLUME_TOKEN`): the value never appears, only the variable name.
          #   3. two documented test placeholders that live in production files.
          #   4. the FTS-compaction benchmark's own SQLCipher key, which encrypts only the scratch
          #      databases that benchmark builds for itself.
          #   5. the purge test's canary string, which that test asserts is ABSENT from the ledger.
          #   7. the SQLCipher keys of the native-backup posture tests
          #      (`daemon/src/tests/posture_de_sauvegarde_native.rs`): every key there follows the
          #      convention `p8NN-cle-<word>` and opens only the throwaway databases that test BUILDS
          #      itself under a temporary directory. The SHAPE is allowlisted, not the file: any other
          #      string in that module is still scanned. Measured on 2026-08-22: four such keys tripped
          #      `generic-api-key` and turned the public CI red.
          #   6. the shipped-unit digest table in `daemon/src/maj_corroboree.rs` — 88 lines of the exact
          #      shape `("plume-NAME.service", "<64 hex>"),`. These are sha256 digests of unit FILES that
          #      live in this same repository, not credentials. A value allowlist is impossible: each digest
          #      changes whenever its unit does. What makes the SHAPE allowlist safe is that another
          #      mechanism verifies every entry — `les_empreintes_livrees_sont_celles_des_fichiers` re-hashes
          #      the files and fails on a stale digest, a missing name or a name in excess. A foreign value
          #      hidden in that table would therefore turn the suite red, which is a stronger check than the
          #      scan. Anything in that file NOT of this shape is still scanned.
          regexTarget = "line"
          regexes = [
            '''REPLACE\(query,'key=soc_\w+','key=plume_\w+'\)''',
            '''\$\{PLUME_[A-Z0-9_]+(:\?|:-|\})''',
            '''Bearer \$\{?[A-Z0-9_]+''',
            '''pentest-secret-''',
            '''env-token-xyz''',
            # 4. `bench/fts-compaction/banc_fts.c` line 27 — the literal SQLCipher key of the FTS5 compaction
            #    harness. It is handed to `PRAGMA key=` on the throwaway databases that harness BUILDS itself
            #    (ref.db, purge.db, arme-*.db, all created by `bench/fts-compaction/mesurer.sh` in a scratch
            #    directory); it opens no production database and is read from no configuration. The exact
            #    VALUE is allowlisted, never the file: a real secret added elsewhere in that benchmark — or
            #    anywhere under bench/ — still trips the scan.
            '''banc-fts-cle-sqlcipher-32-octets''',
            # 5. `daemon/src/tests/purge.rs` line 581 — the canary of the test
            #    `purge_ledger_entry_leaks_no_purged_content`. The test INSERTS this string into a throwaway
            #    event, then asserts it is ABSENT from the purge ledger and from the SOC mirror event: it is
            #    the probe of a confidentiality guard, not a credential to anything. The exact VALUE is
            #    allowlisted, never the file — the rest of purge.rs stays scanned (that path is deliberately
            #    NOT in the `paths` list below).
            '''MOTDEPASSE-ULTRA-SENSIBLE-9f3a''',
            # 6. shipped-unit digest table — shape only, see reason 6 above.
            '''\("plume-[a-z0-9-]+\.(service|timer)", "[0-9a-f]{64}"\),''',
            # 7. native-backup posture test keys — shape only, see reason 7 above.
            '''"p8[0-9]{2}-cle-[a-z-]+"'''
          ]
          # PATH-scoped allowlist — TEST FILES ONLY (never a production path). Each holds documented, offline-generated
          # fixtures: the OIDC/SAML unit-test PEM keys live under `daemon/src/idp/` (a directory module) and in
          # `daemon/src/tests/saml.rs`; the remaining two carry test placeholders.
          paths = [
            '''daemon/src/idp/.*\.rs''',
            '''daemon/src/tests/saml\.rs''',
            '''daemon/src/tests/detection\.rs''',
            '''daemon/src/tests/engagement\.rs''',
          ]
          EOF

      # Pinned gitleaks BINARY (v8.24.3) — no repo token, no license required, and behaves
      # identically on push and pull_request. Replaces the former gitleaks GitHub Action, which now
      # requires a repo token on pull_request events (→ failed every PR). The download is
      # checksum-pinned (sha256 from the release's checksums.txt) so a tampered/substituted asset
      # fails the build. The security job checks plume out at the workspace root (no `path:`), so
      # `--source .` == repo root and the config resolves at $GITHUB_WORKSPACE/.gitleaks-ci.toml
      # (written just above). Scans tree + full history (fetch-depth: 0 above). This job keeps only
      # `permissions: contents: read` — the binary needs no token (least privilege).
      - name: Secret scan (gitleaks, pinned binary — no token/license required)
        run: |
          set -euo pipefail
          GL_VER=8.24.3
          GL_SHA=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz"
          echo "${GL_SHA}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config "$GITHUB_WORKSPACE/.gitleaks-ci.toml" --no-banner --redact --exit-code 1

      # `deny.toml` existait depuis longtemps mais AUCUN job ne l'exécutait : une configuration
      # que personne ne lance n'est pas une garde, c'est de la décoration. Mesuré avant l'ajout —
      # `grep -c "cargo-deny\|cargo deny" ci.yml` = 0.
      #
      # PÉRIMÈTRE : `licenses bans sources`, PAS `advisories`. Les avis sont déjà couverts par
      # `cargo audit --deny warnings` ci-dessus ; les dupliquer n'ajoute rien et importe une
      # fragilité réelle — cargo-deny 0.18.2 échoue à parser un avis portant un score CVSS 4.0
      # (« unsupported CVSS version: 4.0 »), constaté sur la base d'avis locale.
      #
      # Binaire ÉPINGLÉ par version + sha256, comme gitleaks juste au-dessus : `cargo install`
      # recompilerait l'outil à chaque exécution pour le même résultat.
      # P7.7-b — la liste des crates couverts est DÉRIVÉE de l'arborescence, plus ÉNUMÉRÉE.
      # Ce dépôt n'a PAS de workspace Cargo : les crates sont indépendants, et la commande ne
      # nommait que `daemon/Cargo.toml`. `agent` (celui qu'on INSTALLE sur les postes clients),
      # `collector-mail` et `collector-syslog` n'étaient donc vérifiés ni en licences, ni en bans,
      # ni en sources — et un crate ajouté demain ne l'aurait pas été davantage, sans que personne
      # ne le voie. Le `find` découvre les manifestes : couvrir un nouveau crate ne demande plus
      # aucun geste.
      #
      # CE QUE ÇA A TROUVÉ, mesuré le 2026-08-03 en étendant la couverture : `agent` ÉCHOUAIT
      # (code 4) sur `webpki-roots@1.0.8` en `CDLA-Permissive-2.0`. La licence est désormais
      # autorisée NOMMÉMENT et justifiée dans `deny.toml` — pas ajoutée en silence.
      - name: Licences, bans et sources des dépendances (cargo-deny, TOUS les crates découverts)
        run: |
          set -euo pipefail
          CD_VER=0.18.2
          CD_SHA=43c4a79c4b9fd1fcb3dddb305a1b4d8f7ac4a72accd61bb50a0b698789ca894c
          CD_TGZ="cargo-deny-${CD_VER}-x86_64-unknown-linux-musl"
          curl -sSfL -o /tmp/cargo-deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CD_VER}/${CD_TGZ}.tar.gz"
          echo "${CD_SHA}  /tmp/cargo-deny.tgz" | sha256sum -c -
          tar -xzf /tmp/cargo-deny.tgz --strip-components=1 -C /tmp "${CD_TGZ}/cargo-deny"

          # Découverte : un crate = un Cargo.toml de premier niveau (pas de workspace ici).
          mapfile -t MANIFESTES < <(find . -mindepth 2 -maxdepth 2 -name Cargo.toml -not -path './target/*' | sort)

          # VALIDER L'INSTRUMENT : un `find` qui ne rend rien passerait au vert en ne vérifiant
          # RIEN. Le seuil est celui des crates réellement présents aujourd'hui.
          echo "crates découverts : ${#MANIFESTES[@]}"
          printf '  %s\n' "${MANIFESTES[@]}"
          if [ "${#MANIFESTES[@]}" -lt 4 ]; then
            echo "::error::découverte des crates suspecte (${#MANIFESTES[@]} < 4) — la garde ne garderait rien"
            exit 1
          fi

          # Tous les crates sont vérifiés AVANT de conclure : on veut la liste COMPLÈTE des
          # violations, pas seulement la première (sinon chaque correctif en révèle une de plus).
          rc=0
          for m in "${MANIFESTES[@]}"; do
            echo "::group::cargo-deny ${m}"
            /tmp/cargo-deny --manifest-path "${m}" check licenses bans sources || rc=1
            echo "::endgroup::"
          done
          exit "${rc}"

  # ---------------------------------------------------------------------------
  # lint — fmt + clippy, CONSULTATIVE (non-blocking until the tree is proven
  # warning-free). cargo resolves the guatx-core git-dep (core@v0.2.1)
  # directly. TODO: make blocking (`-D warnings`, drop continue-on-error) once
  # the tree is clean.
  # ---------------------------------------------------------------------------
  lint:
    name: lint (fmt + clippy — consultative)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout plume
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust toolchain (pinned) + rustfmt/clippy
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # @stable (no semver tags; pinned to stable branch commit)
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: cargo fmt --all --check (consultative)
        working-directory: daemon
        run: cargo fmt --all --check
        continue-on-error: true

      - name: cargo clippy (consultative, no -D warnings)
        working-directory: daemon
        run: cargo clippy --locked --all-targets
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # collectors — `cargo test --locked` pour les DEUX collecteurs compilés.
  #
  # POURQUOI CE JOB EXISTE. Ces deux crates étaient bâtis par leur Dockerfile et
  # vérifiés en licences/bans par le job `security` (qui découvre TOUS les
  # Cargo.toml), mais leur SUITE n'était exécutée nulle part : `test` et
  # `cold-tier` ne connaissent que `daemon/`, `agent-ci.yml` ne connaît que
  # `agent/`. Les gardes que ces crates portent — une liste d'adresses posée et
  # non comprise ne doit pas ouvrir le :514 ; une boîte qu'on ne sait pas
  # examiner ne se conclut pas par « 0 alerte » — n'auraient donc jamais tourné
  # en intégration, et une garde qui ne tourne pas est une garde en nom seulement.
  #
  # LES COMPTES SONT EXACTS, PAS DES PLANCHERS, et c'est la discipline de ce
  # dépôt : la CONSTANCE du compte est ce qui attrape une garde qui aurait cessé
  # d'être énumérée (un `#[cfg]` mal posé, un module de test décroché). Ils sont
  # écrits ICI et nulle part ailleurs.
  # ---------------------------------------------------------------------------
  collectors:
    name: collectors (syslog + mail — cargo test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout plume
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # @stable (no semver tags; pinned to stable branch commit)
        with:
          toolchain: "1.96.0"

      - name: Cache cargo (registry + target)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            collector-syslog/target
            collector-mail/target
          key: ${{ runner.os }}-cargo-collectors-${{ hashFiles('collector-syslog/Cargo.lock', 'collector-mail/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-collectors-

      # 49 : MESURÉ le 2026-08-21 par ÉNUMÉRATION (`cargo test -- --list`, deux lectures
      # concordantes : le compte des lignes `: test` et le total annoncé par cargo). Le lot `S36` a
      # ajouté à ce crate la garde de la liste d'adresses (une liste POSÉE ne peut jamais produire
      # une liste vide), le refus d'un pair dont l'adresse n'est pas lue, la paire sur l'identité de
      # l'hôte et la parité de vocabulaire avec le module du démon.
      - name: cargo test (collector-syslog) + assert the test count
        working-directory: collector-syslog
        env:
          EXPECTED_SYSLOG_TESTS: "49"
        run: |
          set -euo pipefail
          cargo test --locked --verbose 2>&1 | tee /tmp/syslog-tests.log
          total=$(grep -oP 'test result: ok\. \K[0-9]+' /tmp/syslog-tests.log | paste -sd+ | bc)
          echo "collector-syslog tests passed: $total (expected $EXPECTED_SYSLOG_TESTS)"
          if [ "$total" != "$EXPECTED_SYSLOG_TESTS" ]; then
            echo "::error::collector-syslog test count is $total, expected $EXPECTED_SYSLOG_TESTS."
            echo "::error::If the change legitimately adds or removes tests, update EXPECTED_SYSLOG_TESTS"
            echo "::error::HERE, from your own RE-ENUMERATION (cargo test -- --list) — never from a sum."
            exit 1
          fi

      # 5 : MESURÉ le 2026-08-21 par la MÊME énumération. Ce crate n'avait AUCUN test avant le lot
      # `S36` ; les cinq sont la paire sur l'identité, le contrat d'aveu, la parité de vocabulaire et
      # la garde dérivée qui exécute le collecteur contre une arborescence de courrier fabriquée.
      - name: cargo test (collector-mail) + assert the test count
        working-directory: collector-mail
        env:
          EXPECTED_MAIL_TESTS: "5"
        run: |
          set -euo pipefail
          cargo test --locked --verbose 2>&1 | tee /tmp/mail-tests.log
          total=$(grep -oP 'test result: ok\. \K[0-9]+' /tmp/mail-tests.log | paste -sd+ | bc)
          echo "collector-mail tests passed: $total (expected $EXPECTED_MAIL_TESTS)"
          if [ "$total" != "$EXPECTED_MAIL_TESTS" ]; then
            echo "::error::collector-mail test count is $total, expected $EXPECTED_MAIL_TESTS."
            echo "::error::If the change legitimately adds or removes tests, update EXPECTED_MAIL_TESTS"
            echo "::error::HERE, from your own RE-ENUMERATION (cargo test -- --list) — never from a sum."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # ci-ok — SINGLE required status-check context for the `main` branch ruleset.
  # The name `CI` is STABLE: it does not depend on any matrix or on the set of
  # upstream jobs, so evolving test/security/lint never breaks the "required
  # check" rule. Without this aggregation job the ruleset would have to require
  # each job name directly — the day one is renamed/removed, the required check
  # would never report again and `main` would become unpushable, including for
  # the very fix that would repair it.
  # ---------------------------------------------------------------------------
  ci-ok:
    name: CI
    if: always() # otherwise a failed upstream job SKIPS this one instead of failing it
    needs: [test, cold-tier, shell, features, security, lint, collectors]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs must have SUCCEEDED
        # `skipped` and `cancelled` are treated as failures ON PURPOSE: GitHub
        # counts a required-but-skipped check as satisfied, which would let a
        # job that never ran slip through.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::a CI job did not succeed: ${{ join(needs.*.result, ', ') }}"
          exit 1
