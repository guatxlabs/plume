[package]
name = "plume-collector-mail"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Collecteur SOC mail (host-natif) : lit le maildir, applique des patterns IOC/phishing, emet des events MINIMAUX vers le spool (jamais de body en clair). cf. GuatX-Infra ADR-0008."

[[bin]]
name = "plume-collector-mail"
path = "src/main.rs"

[dependencies]
mail-parser = "0.10"
regex = "1"
url = "2.5"
scraper = "0.20"
base64 = "0.22"
percent-encoding = "2.3"
once_cell = "1"
walkdir = "2"
anyhow = "1"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
