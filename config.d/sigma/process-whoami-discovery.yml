# Exemple livré (Slice #7, pièce 3). Démontre : logsource.category `process_creation` -> CIM `exec`
# (nom canonique CIM v1.3 ; c'est ce que le chemin EventID 4688 des collecteurs Windows livrés et
# l'`execve` d'auditd émettent réellement), et un champ ÉTENDU quelconque (CommandLine ->
# fields.CommandLine via json_extract) avec `|contains`. MITRE T1033 (System Owner/User Discovery).
#
# ⚠️ INERTE SUR UN WINDOWS PAR DÉFAUT, ET C'EST VOULU COMME DÉMONSTRATION : `CommandLine` n'apparaît
# dans un 4688 QUE si la GPO « Include command line in process creation events » est activée. Cette
# règle montre la TRADUCTION d'un champ étendu, pas une détection active out-of-the-box — l'importeur
# le signale (avertissement « champ étendu inerte »). Une règle qui filtre `NewProcessName` (toujours
# présent dans un 4688) fire, elle. Cf. docs/SIGMA-IMPORTER.md §4a.
#
# ⚠️ ET SUR LINUX, ELLE EST INERTE POUR UNE RAISON PLUS FORTE : STRUCTURELLE, PAS UN RÉGLAGE.
# MESURÉ le 2026-08-01 (VM Ubuntu 24.04 Server amd64, règles auditd chargées, 533 événements
# `category=exec` réels) : `CommandLine` = 0/533. Le chemin `execve` d'auditd émet exactement
# action·auid·cim·comm·exe·key·success·syscall·uid — jamais `CommandLine`, et aucune option ne le fera
# apparaître. Sur Windows une GPO suffit ; sur Linux il n'y a rien à activer. La jumelle Linux qui
# FIRE (`exe|contains`, mesurée à 407/533 sur le même jeu) est livrée à côté :
# `config.d/sigma/process-whoami-discovery-linux.yml`. Gardez les deux : c'est le couple qui enseigne
# la différence entre « champ traduit » et « champ peuplé ».
title: Whoami Command Execution (Discovery)
id: 7c1e0a55-4b2d-49f8-9a3c-6e2b8d10f9c4
status: stable
description: Execution of whoami, a common host/user discovery command post-compromise.
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains: whoami
    condition: selection
level: low
tags:
    - attack.discovery
    - attack.t1033
