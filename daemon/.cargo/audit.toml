# plume (daemon) — cargo-audit : advisories acceptés (convention famille, cf forge console/.cargo/audit.toml).
# Chaque entrée = advisory INFIXABLE-par-update, justifiée + « lever quand ». À revoir régulièrement.
[advisories]
ignore = [
  # rsa 0.9 — RUSTSEC-2023-0071 (Marvin, timing side-channel). Aucune release patchée n'existe.
  # Plume n'utilise RSA que pour VÉRIFIER des signatures d'assertions IdP (op. clé publique) et
  # SIGNER des AuthnRequests sortantes — AUCUN déchiffrement RSA de ciphertext attaquant (pas
  # d'EncryptedAssertion ; les seuls decrypt du tree sont `age`). Pas d'oracle Marvin. Confiné à
  # la feature `saml` (OFF par défaut). Lever dès qu'une version `rsa` patchée paraît.
  "RUSTSEC-2023-0071",
  # crypto-bigint 0.5 — RUSTSEC-2026-0387 (branches dépendant du secret dans des opérations voulues en
  # temps constant ; avis du 2026-10-23, entrée posée le 2026-10-24). Corrigé en >= 0.7.6 seulement ; 0.7.6 à 0.7.8 retirées
  # le 2026-10-25 (rupture amont #1373), la 0.7 du lock est en 0.7.9 (via kryptering), la 0.5.5
  # reste, tirée par elliptic-curve 0.13 (ecdsa) sous bergshamra/samlify, qui exige ^0.5 : aucune montée
  # possible. Confiné à la feature `saml` (OFF par défaut, absente de l'image stock `ldap,cold_tier`).
  # Exposition résiduelle UNIQUEMENT si `saml` est compilée ET `sign_authn_requests=true` (défaut false)
  # ET la clé SP est EC : la signature ECDSA d'AuthnRequest manie alors un scalaire secret. Vérifier une
  # signature d'IdP n'opère que sur des valeurs publiques. Clé SP RSA recommandée d'ici là. Ignorer cet ID
  # masquerait aussi une 0.7 vulnérable : la 0.7 du lock doit rester >= 0.7.6 (relire Cargo.lock).
  # Lever dès qu'une 0.5 corrigée paraît, ou dès que l'arbre saml passe à crypto-bigint 0.7 (elliptic-curve
  # 0.14 / bergshamra à jour).
  "RUSTSEC-2026-0387",
  # paste 0.1 — RUSTSEC-2024-0436 (unmaintained). Proc-macro de BUILD, transitif via
  # clickhouse/parquet optionnels. Aucune surface runtime, pas de successeur. Lever si retiré de l'arbre.
  "RUSTSEC-2024-0436",
  # proc-macro-error2 — RUSTSEC-2026-0173 (unmaintained). Proc-macro de BUILD via age->i18n-embed-fl.
  # Compile-time only, aucune surface runtime. Lever si l'arbre s'en débarrasse.
  "RUSTSEC-2026-0173",
  # basic-toml 0.1 — RUSTSEC-2026-0374 (unmaintained, NON vulnérable). Tiré par i18n-config, lui-même
  # tiré UNIQUEMENT par deux proc-macros (i18n-embed-fl, i18n-embed-impl) via age : lecture d'i18n.toml
  # à la compilation, aucune surface runtime. Pas de version d'age qui s'en passe au 2026-10-21.
  # Lever si l'arbre s'en débarrasse.
  "RUSTSEC-2026-0374",
  # yaml-rust 0.4 — RUSTSEC-2024-0320 (unmaintained, NON vulnérable). Front-end de l'importeur
  # Sigma uniquement. Successeur `yaml-rust2` = crate différent (API-break -> risque sur toute la
  # suite par défaut ; son compte vivant est `EXPECTED_TESTS` dans ci.yml, pas recopié ici).
  # Lever dès migration vers yaml-rust2.
  "RUSTSEC-2024-0320",
]
