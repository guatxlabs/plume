[package]
name = "plume-daemon"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
# Shared SOQL compiler core. Public builds resolve this from the published git tag.
# Local development overrides it to the sibling checkout via .cargo/config.toml (paths override, git-ignored).
guatx-core = { git = "https://github.com/guatxlabs/core", tag = "v0.2.4" }
axum = "0.8"
# Verrous SANS empoisonnement (audit #67) : remplace std::sync::Mutex/RwLock -> pas de cascade poison
# (un panic sous garde 500-ait DÉFINITIVEMENT ce tenant). Drop-in ; guards !Send (le rejet compile-time du
# lock-tenu-au-travers-d'un .await est PRÉSERVÉ). Déjà dans le lockfile (0.12.x, tiré transitivement).
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
tower-http = { version = "0.5", features = ["fs", "compression-gzip", "catch-panic"] }
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl", "functions", "hooks"] }
regex = "1"
prost = "0.13"
snap = "1"
# OTLP traces (#41) — décompression gzip du corps OTLP/HTTP (Content-Encoding: gzip). `flate2` est DÉJÀ
# dans l'arbre (transitif via tower-http `compression-gzip`) -> AUCUNE crate compilée nouvelle ; on la
# promeut en dépendance DIRECTE pour l'utiliser explicitement (cap de décompression anti-bombe). Utilisée
# UNIQUEMENT sur le chemin OTLP (inerte tant que PLUME_OTLP_TRACES != 1 -> mode 0 byte-identique).
flate2 = "1"
serde_json = "1"
bcrypt = "0.15"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.23"
sha2 = "0.10"
# NATIVE IdP (#44) — validation JWT id_token OIDC (RS256/ES256) via JWKS. `jsonwebtoken` est pure-Rust
# (ring, DÉJÀ dans l'arbre via rustls ; + serde/simple_asn1/pem). AUCUNE dépendance native/OpenSSL
# NOUVELLE (le sqlcipher vendoré tire déjà OpenSSL, mais jsonwebtoken n'y touche pas -> ring). Utilisé
# UNIQUEMENT sur le chemin de login OIDC (inerte tant qu'aucun provider OIDC n'est configuré -> mode 0).
jsonwebtoken = "9"
# TOTP MFA (#44, RFC 6238) — HMAC-SHA1 (l'algo par défaut de Google Authenticator/Authy). `sha1` pur-Rust
# (RustCrypto, même famille que `sha2` déjà présent). Pas de crate TOTP tierce (l'algo tient en ~30 lignes,
# testées) ni de génération de QR côté serveur (on renvoie l'URI otpauth:// standard, QR rendu ailleurs).
sha1 = "0.11"
# L1 (garde disque à l'ingest) : statvfs(3) pour mesurer l'espace LIBRE RÉEL du volume du spool avant
# d'accepter un nouvel ingest -> refus explicite (503) en pré-saturation, JAMAIS une perte silencieuse.
# `libc` est minimale, sans dépendance transitive (bindings système FFI purs) — cf. Vague 2 qui avait
# différé statvfs faute de cette crate ; on l'implémente ici PROPREMENT.
libc = "0.2"
ed25519-dalek = "2"
# TLS natif CONFIG-GATED (durcissement standalone, item 1) : si PLUME_TLS_CERT+PLUME_TLS_KEY sont posés,
# le listener sert en HTTPS (rustls) ; sinon HTTP comme aujourd'hui (DÉFAUT -> k3s/Traefik inchangé).
# Provider crypto = `ring` (aws-lc-rs exigerait cmake/nasm, absents ; ring se compile avec cc/perl déjà
# requis par le sqlcipher vendoré). D'où `tls-rustls-no-provider` côté axum-server + `rustls/ring` ici.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12"] }
# Backup compressé+chiffré (CLI `backup --compress` / `restore`) — voir bloc backup dans main.rs.
# zstd : compression du PLAINTEXT (la DB SQLCipher chiffrée est incompressible) -> ~5-10x plus petit.
# age  : chiffrement STREAMING par passphrase (scrypt), crypto auditée, pure-Rust (pas de hand-rolled).
# Les deux streament en flux borné (buffer ~1 MiB) -> tient sous la limite RAM 2 GiB du pod.
zstd = "0.13"
age = "0.11"
# Importeur Sigma (Slice #7, pièce 3) : les règles Sigma sont du YAML. `yaml-rust` est un parseur YAML
# 100 % Rust, sans dépendance système (linked-hash-map uniquement), déjà présent dans le cache cargo.
# Utilisé SEULEMENT par le front-end de l'importeur (YAML -> serde_json::Value) ; le cœur de traduction
# Sigma -> SOQL opère sur `Value` (testable en JSON pur, sans YAML). AUCUN impact data-plane / mode 0.
yaml-rust = "0.4"
# WARM tier analytique (#15, `DuckDbStore` derrière la SPI `EventStore`). DÉPENDANCE OPTIONNELLE,
# feature `duckdb` OFF PAR DÉFAUT + EXPÉRIMENTALE (voir docs/DUCKDB-STORE.md). Le build DÉFAUT (sans
# `--features duckdb`) NE LINKE PAS duckdb -> budget 2 Go / mode 0 byte-identiques préservés.
#
# ⚠️ BUILD — UN-BUNDLED (PAS `bundled`) : on LIE une `libduckdb` SYSTÈME/pré-compilée au lieu de compiler
# l'amalgamation C++ de DuckDB. `features = ["bundled"]` a été RETIRÉ DÉLIBÉRÉMENT (revue store-resource) :
# le mode bundled forçait `libduckdb-sys` à compiler un ÉNORME single-TU C++ via `cc1plus`, ce qui exigeait
#   (a) un toolchain C++ (`c++`/`cc1plus`) — ABSENT du VPS 2 Go (seul un compilateur C est requis par le
#       sqlcipher vendoré) -> échec immédiat `cc-rs: failed to find tool "c++"` ;
#   (b) ~4 Go de RAM de build + plusieurs minutes de CPU mono-cœur -> OOM/90% CPU sur un hôte modeste.
# Sans `bundled`, `libduckdb-sys` (bindings PRÉ-GÉNÉRÉS, donc pas de bindgen/libclang) cherche une libduckdb
# système via pkg-config / `DUCKDB_LIB_DIR` (ou téléchargement `DUCKDB_DOWNLOAD_LIB`) et se contente de la
# LIER (`-lduckdb`) : PLUS DE `cc1plus`, PLUS D'OOM. Corollaire : `--features duckdb` EXIGE désormais une
# `libduckdb` présente sur l'hôte de build ; à défaut, l'échec est un LINK CLAIR ET RAPIDE
# (`cannot find -lduckdb`) au lieu de l'OOM opaque d'antan. (La crate Rust `arrow` reste compilée -> DuckDB
# reste un tier de build lourd, réservé à un hôte ESN/MSSP ; JAMAIS le VPS 2 Go.) ClickHouse (client
# pur-Rust, ci-dessous) est le chemin scale-out SUPPORTÉ ; DuckDB est EXPÉRIMENTAL. Sélection runtime
# future : `PLUME_STORE=duckdb` (opt-in + ack `PLUME_STORE_DUCKDB_EXPERIMENTAL=1`, caps runtime dans
# `duckdb_store.rs` : memory_limit + threads + watchdog budget_ms).
duckdb = { version = "1", optional = true }
# COLD/scale tier analytique (#18, `ClickHouseStore` derrière la SPI `EventStore`). DÉPENDANCE
# OPTIONNELLE, feature `clickhouse` OFF PAR DÉFAUT : la crate `clickhouse` est un client HTTP async
# (hyper/tokio) — le build DÉFAUT (sans `--features clickhouse`) NE LINKE PAS clickhouse -> budget 2 Go
# / mode 0 byte-identique préservés. Sélection runtime future : `PLUME_STORE=clickhouse` (opt-in, ESN/
# MSSP). `serde` (derive) est tiré UNIQUEMENT par cette feature (dérive `clickhouse::Row` + `Serialize`
# de la ligne d'INSERT typée batchée) ; il reste absent du build par défaut.
clickhouse = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# LDAP / Active Directory bind (#44, priorité 2). OFF PAR DÉFAUT (feature `ldap`, comme duckdb/clickhouse) :
# `ldap3` tire tokio-rustls (TLS pur-Rust, PAS d'OpenSSL grâce à default-features=false + tls-rustls-ring —
# 0.12 exige un provider crypto EXPLICITE : on aligne sur `ring`, déjà en arbre via rustls/jsonwebtoken, PAS
# aws-lc-rs qui exigerait cmake/nasm absents ; ce bump 0.11->0.12 purge l'ancienne pile rustls 0.21/ring 0.16/
# rustls-webpki 0.101/rustls-pemfile 1.0 -> efface RUSTSEC-2025-0009/-0010, -2026-0098/-0099/-0104, -2025-0134). Le
# build/test DÉFAUT NE LINKE PAS ldap3 -> budget 2 Go + mode 0 byte-identiques préservés. Les fonctions
# PURES (échappement de filtre RFC 4515, mapping groupe->rôle) sont compilées/testées SANS la feature ;
# seul le bind réseau est feature-gated. Activer : `cargo build --features ldap` (déploiement on-prem/AD).
ldap3 = { version = "0.12", default-features = false, features = ["sync", "tls-rustls-ring"], optional = true }
# SAML 2.0 SP (#44, priorité 3). OFF PAR DÉFAUT (feature `saml`, comme ldap/duckdb/clickhouse) : `samlify`
# 0.3 est un re-export de `saml-rs` 0.3 — SAML 2.0 100 % pur-Rust (quick-xml + RustCrypto via `bergshamra`
# XML-DSig/C14N/XML-Enc ; AUCUNE dépendance native OpenSSL/libxml/xmlsec, contrairement à `samael` qui est
# banni). La vérification de signature se fait contre un certificat X.509 STATIQUEMENT configuré
# (`verify_signature(xml, &[cert])`, pas de TOFU métadonnées) et le crate porte des défenses XSW en
# profondeur (garde SubjectConfirmationData, rejet d'ID dupliqués, rejet multi-racine, liaison stricte
# référence→élément, couverture d'une seule assertion, rejet de référence externe, cert inline non-fiable).
# Le build/test DÉFAUT NE LINKE PAS samlify -> budget 2 Go + mode 0 byte-identiques préservés. Les fonctions
# PURES (config, RelayState signé HMAC, mapping groupe->rôle, garde d'algorithme anti-SHA-1) sont
# compilées/testées SANS la feature ; seule la consommation d'assertion (finish_sso) est feature-gated.
# Sans la feature, les routes SAML renvoient 501 (miroir strict du précédent LDAP). Activer : `--features saml`.
samlify = { version = "0.3", optional = true }
# COLD tier PARQUET (#18 Phase 1) — WRITER + AGING du tier froid colonnaire OPT-IN. DÉPENDANCE OPTIONNELLE,
# feature `cold_tier` OFF PAR DÉFAUT : le build/test DÉFAUT (sans `--features cold_tier`) NE LINKE PAS
# `parquet` -> budget 2 Go / mode 0 byte-identiques préservés. `default-features = false` DÉLIBÉRÉ : on ne
# tire QUE les codecs `zstd`+`snap` (déjà dans le lockfile via le backup/prost) et JAMAIS la feature `arrow`
# (kernels de calcul + arrow-array/-buffer/... ; on décode colonne->bind SQLite en P2, on n'a AUCUN besoin
# des compute kernels). Chaîne native = `zstd-sys` (compilateur C `cc`, DÉJÀ requis par le sqlcipher vendoré)
# — AUCUN C++/`cc1plus`/bindgen NOUVEAU (contrairement à duckdb bundled). `thrift` (métadonnées Parquet) est
# 100 % Rust. Aligné sur arrow 58.x DÉJÀ résolu dans le lock (via `duckdb`, off) -> pas de 2e version d'arrow.
# Activer : `cargo build --features cold_tier` (tier froid d'un déploiement rétention-longue ; jamais requis).
parquet = { version = "58", default-features = false, features = ["zstd", "snap"], optional = true }
# COLD tier CHIFFREMENT AT-REST (#18 Phase 1, durcissement confidentialité) — le tier froid DOIT égaler le
# chiffrement at-rest du hot (SQLCipher) : modèle de menace « ne pas faire confiance au disque ». On RÉUTILISE
# la pile crypto DÉJÀ en arbre : `age` (STREAM AEAD ChaCha20-Poly1305, nonce par-fichier aléatoire + compteur
# de chunk -> JAMAIS de réutilisation de nonce ; MÊME crate/chemin que le backup chiffré), + `hkdf`+`sha2`
# (RustCrypto) pour DÉRIVER une clé cold à domaine séparé (`plume-cold-aead-v1`) depuis la clé SQLCipher
# (jamais la clé brute). `optional=true` + rattachés à la feature `cold_tier` : le build/mode 0 par défaut ne
# les utilise PAS -> byte-identique préservé (age/sha2/base64 sont déjà des dép DIRECTES non-optionnelles,
# utilisées ici seulement sous `#[cfg(feature=\"cold_tier\")]`).
#
# CE QUE CE LOT NE TIENT PLUS, ET IL FAUT LE LIRE AVANT DE LE CROIRE. Ce bloc a longtemps porté l'invariante
# « AUCUNE crate compilée NOUVELLE » : `hkdf` 0.12 était DÉJÀ dans le graphe (tiré par `age-core`), donc
# l'activer ne coûtait rien. `hkdf` 0.13.0 (2026-03-30) a cassé cette gratuité et l'invariante est RETIRÉE
# plutôt que laissée à mentir. Mesuré sur le lock le 2026-08-26 : hkdf 0.13 dépend de `hmac` 0.13, qui exige
# `digest::EagerHash` (génération `digest` 0.11), tandis que `hkdf` 0.12.4 reste tiré — dans le graphe
# `cold_tier`, par `age-core` seul ; à l'échelle du lock, aussi par `elliptic-curve`, `kryptering` et
# `bergshamra-crypto`. Les deux générations COEXISTENT donc dans le binaire cold_tier.
#
# LE COÛT RÉEL, MESURÉ ET NON ADDITIONNÉ. Relevé le 2026-08-26 SUR L'ARBRE, sur un poste de développement,
# en comparant DEUX manifestes qui ne diffèrent que par ces trois lignes-ci (`hkdf` 0.12 sans `sha2_v11`
# contre `hkdf` 0.13 avec), la seule ligne de production qui en dépend (`cold_store/crypto.rs`) basculant
# avec elles :
#   · GRAPHE `--features cold_tier` : 235 -> 240 paquets. Les CINQ ajoutés sont `hkdf` 0.13.0, `hmac` 0.13.0,
#     `sha2` 0.11.0, `ctutils` 0.4.2 et `cmov` 0.5.4 ; AUCUN n'est retiré en échange. Les deux derniers ne se
#     déduisent PAS d'une lecture du lock, et pas pour la raison qu'on croit : le lock les portait déjà (ils
#     y entrent par la feature `saml`, optionnelle). Ce qui les rend NEUFS, c'est qu'ils n'étaient dans AUCUN
#     graphe compilé — `cargo tree` sur le manifeste 0.12, feature `cold_tier` comprise, répond « did not
#     match any packages ». C'est le GRAPHE qui dit ce qui compile, jamais le lock : le lock est l'union de
#     toutes les combinaisons de features. Ils entrent parce que `hmac` 0.13 allume la feature de `digest`
#     0.11.3 qui compare les tags en temps constant.
#   · GRAPHE PAR DÉFAUT : 222 -> 222, et les ensembles sont IDENTIQUES (différence VIDE). Un déploiement qui
#     ne prend pas `cold_tier` ne paie rien du tout — c'est ce que `optional=true` promet, et c'est ici
#     mesuré plutôt que supposé.
#   · TEMPS DE COMPILATION des cinq unités (rapport `cargo build --timings`, profil `debug`) : 3,36 s de
#     processeur en tout (`sha2` 0.11 1,68 · `ctutils` 0,55 · `cmov` 0,41 · `hmac` 0.13 0,37 · `hkdf` 0.13
#     0,35), auxquels s'ajoute le RECALCUL de `digest` 0.11.3 (0,42 s) et de `sha1` 0.11.0 (0,84 s) sous la
#     feature supplémentaire — unités déjà présentes, recompilées, pas ajoutées. La compilation de
#     `plume-daemon` lui-même, elle, ne bouge pas : 28,91 s contre 29,39 s, le même travail des deux côtés.
#   · TAILLE du binaire `plume-daemon` de l'arbre, construit `--features cold_tier`, profil `debug` :
#     +639 328 octets, soit +0,19 %.
#
# TRANCHÉ, ET LA RAISON N'EST PAS LE PRIX : ON GARDE LES DEUX PILES. « Monter toute la pile d'un coup pour
# n'en garder qu'une » n'est pas une décision que ce manifeste peut prendre. Mesuré le même jour sur le
# graphe `cold_tier` : `hkdf` 0.12.4 y est tiré par `age-core`, et `sha2` 0.10.9 par `age`, `age-core`,
# `ed25519-dalek`, `scrypt` et `rust-embed-utils` (17 paquets à l'échelle du lock entier, `hkdf` 0.12.4 en
# ayant 4). Le démon peut cesser de s'en servir : les deux générations RESTENT, parce qu'elles appartiennent
# à des dépendances qui ne sont pas les nôtres — à commencer par `age`, qui EST l'AEAD de ce tier froid.
# Rester sur `hkdf` 0.12 n'éviterait donc AUCUNE coexistence ; cela laisserait seulement une mise à jour de
# dépendance au rouge indéfiniment (clé `P7.19-c`), ce que la chaîne d'approvisionnement de ce dépôt existe
# pour empêcher. Le budget de 2 Gio, lui, est un budget de MÉMOIRE VIVE : ces cinq unités sont derrière
# `optional=true`, et rien de ce qu'elles apportent ne s'exécute dans un déploiement sans `cold_tier`.
#
# CE QUE CETTE MESURE NE DIT PAS, et il faut le dire ici plutôt que le laisser croire : la taille du binaire
# de RELEASE. Ce profil-là est `opt-level = \"z\"`, `lto = true`, `strip = true` — l'écart y est
# nécessairement PLUS PETIT (l'édition de liens globale retire le code non atteint), mais il n'a pas été
# mesuré : il aurait fallu deux reconstructions complètes du graphe, la montée d'`axum` du même lot ayant
# invalidé les artefacts de release existants.
#
# CE QUI NE BOUGE PAS PAR AILLEURS : `digest` 0.11.3, `block-buffer` 0.12 et `crypto-common` 0.2 étaient DÉJÀ
# dans le graphe par défaut (tirés par `sha1 = \"0.11\"`, dép DIRECTE non-optionnelle, TOTP #44). `bytes`
# reste lui aussi déjà présent (via `parquet`/hyper) ; 100 % pur-Rust des deux côtés.
hkdf = { version = "0.13", optional = true }
# SHA-256 de la GÉNÉRATION `digest` 0.11, et RIEN D'AUTRE. `hkdf::Hkdf<H>` 0.13 se déplie en
# `GenericHkdf<Hmac<H>>` et `Hmac<H>` de hmac 0.13 exige `H: digest 0.11::EagerHash` : le `sha2 = \"0.10\"`
# direct du démon (17 paquets du lock en dépendent — `age`, `rsa`, `ed25519-dalek`... — il ne PEUT pas être
# retiré) est de la génération `digest` 0.10 et n'implémente pas ce trait. Les deux sha2 coexistent donc, sous
# DEUX noms distincts, exactement comme `sha1 0.11` coexiste déjà avec `sha2 0.10` dans cette même crate.
# LA DÉRIVATION NE CHANGE PAS D'UN OCTET, et c'est la seule chose qui compte ici — mais il faut dire COMMENT
# on le sait, parce que « déduit » et « mesuré » ne se valent pas et que le premier est ici le plus fort.
# HKDF-SHA256 est RFC 5869 des DEUX côtés : la valeur attendue n'est pas ce que rend notre code, c'est ce que
# la NORME impose. `cold_hkdf_derivation_gelee_rfc5869` en fait une propriété REJOUABLE plutôt qu'un
# raisonnement — il ancre l'implémentation liée aux vecteurs PUBLIÉS de la RFC (§ A.1, et § A.3 y compris par
# `new(None, …)`, la forme exacte qu'emploie la production), gèle l'octet dérivé pour une clé de test
# PUBLIQUE, et exige les deux témoins négatifs (un octet du label, un octet de l'ikm). Ce qu'il ne fait PAS,
# et personne ne devrait le lire autrement : rejouer un « avant/après ». Plus une ligne de ce dépôt ne
# construit la valeur avec `hkdf` 0.12 ; l'égalité avec l'ancienne pile se DÉDUIT de la norme et se VÉRIFIE
# contre ses vecteurs, ce qui vaut mieux qu'une comparaison du code à lui-même.
sha2_v11 = { package = "sha2", version = "0.11", optional = true }
# `bytes::Bytes` = tampon EN MÉMOIRE (ChunkReader parquet) sur lequel on rejoue le Parquet DÉCHIFFRÉ (le
# lecteur parquet exige un accès aléatoire -> footer ; le déchiffrement age est SÉQUENTIEL. Fichiers ~8 Mio ->
# on déchiffre en flux vers un Bytes borné puis on décode row-group par row-group ; JAMAIS de plaintext DISQUE).
bytes = { version = "1", optional = true }

[features]
# OFF par défaut + EXPÉRIMENTAL. `cargo build/test` NU = SqlcipherStore SEUL (SMB / 2 Go / parité). Le tier
# WARM DuckDB est un opt-in de COMPILATION réservé à un hôte ESN/MSSP disposant d'une `libduckdb` SYSTÈME
# (un-bundled -> LINK `-lduckdb`, plus de `cc1plus`/OOM ; cf. bloc dép `duckdb` ci-dessus + docs/DUCKDB-STORE.md).
# JAMAIS buildé NI activé sur le VPS 2 Go. ClickHouse est le chemin scale-out SUPPORTÉ ; DuckDB reste
# expérimental : caps runtime (memory_limit + threads + watchdog budget_ms) présents mais gate
# `PLUME_STORE_DUCKDB_EXPERIMENTAL=1` (avertissement bruyant sinon). Parité crypto/backup NON garantie.
duckdb = ["dep:duckdb"]
# COLD/scale tier ClickHouse (#18). OFF par défaut (idem `duckdb`) : opt-in de compilation pour un
# déploiement scale multi-nœud (RFC Ph2 #18). Tire la crate `clickhouse` (async/HTTP) + `serde` derive.
clickhouse = ["dep:clickhouse", "dep:serde"]
# COLD/scale tier DISTRIBUÉ HA multi-nœud (#70) — SCAFFOLD INERTE. Sur-feature de `clickhouse` : opt-in de
# compilation des FONDATIONS de la distribution (topologie, DDL Distributed/Replicated injection-safe,
# coordination Keeper stub, ingest stateless, hot→cold). N'est PAS activée par `--features clickhouse`
# (#18 single-node reste byte-identique) ; aucun câblage runtime -> mode 0 inchangé. Effort multi-trimestre.
clickhouse-ha = ["clickhouse"]
# COLD tier PARQUET (#18 Phase 1). OFF par défaut : opt-in de compilation du WRITER + de la branche d'AGING
# (hot SQLite -> Parquet colonnaire). Tire `parquet` (default-features=false : codecs zstd/snap SEULEMENT,
# PAS d'arrow). Sans la feature, `cold_store.rs` n'est pas compilé et la branche cold de `retention_run` est
# INEXISTANTE (mode 0 byte-identique). Le gate RUNTIME `PLUME_COLD_TIER` doit AUSSI être posé pour l'activer.
cold_tier = ["dep:parquet", "dep:hkdf", "dep:sha2_v11", "dep:bytes", "guatx-core/cold_tier"]
# LDAP/AD bind réseau (#44). OFF par défaut : opt-in de compilation pour un déploiement on-prem/AD. Tire
# `ldap3` (tokio-rustls, pur-Rust). Sans cette feature, le login LDAP renvoie 501 (code présent, non linké).
ldap = ["dep:ldap3"]
# SAML 2.0 SP (#44). OFF par défaut : opt-in de compilation. Tire `samlify`/`saml-rs`/`bergshamra`
# (pur-Rust, RustCrypto). Sans cette feature, les routes SAML renvoient 501 (code présent, non linké).
saml = ["dep:samlify"]
# SINK OBJET COMPATIBLE S3 POUR L'ORDONNANCEUR DE SAUVEGARDE. OFF PAR DÉFAUT + **ZÉRO CAISSE NOUVELLE**.
# Feature de COMPILATION PURE : sans elle, `sink_s3.rs` n'est PAS compilé et l'ordonnanceur REFUSE une
# destination `s3://` exactement comme avant (mode 0 inchangé). Avec elle, aucune dépendance ne s'ajoute au
# graphe — la signature v4 est de l'arithmétique HMAC-SHA256 + SHA-256, et les deux primitives sont DÉJÀ
# compilées dans le profil par défaut (`util::hexcrypto`, bâti sur `sha2`, dépendance directe existante) ;
# le transport réutilise `util::http_client` + les racines rustls/ring déjà liées.
# MESURE QUI A TRANCHÉ (2026-08-19, `cargo tree --prefix none | sort -u`, résolution seule) — graphe du
# démon en profil par défaut = 211 caisses ; `aws-sdk-s3`+`aws-config` en ajouteraient **103** (dont
# `aws-lc-sys` et `cmake`, outillage que ce fichier déclare ailleurs ABSENT de l'hôte de compilation visé),
# `rust-s3` en ajouterait **44**. Écrire la signature ici en ajoute **0**.
# CE QU'ELLE NE FAIT PAS : ni multipart (donc plafond du PUT simple), ni rétention côté bucket, ni
# restauration/listage, ni identifiants par rôle d'instance. Détail dans l'en-tête de `src/sink_s3.rs`.
s3_backup = []
# COUCHE IA CONSEIL (#16, advisory NL→SOQL). OFF PAR DÉFAUT + RAM-NEUTRE. Feature de COMPILATION PURE côté
# daemon : AUCUNE crate nouvelle (l'égress réutilise le client HTTP interne `http_call`/rustls-ring déjà
# lié ; le JSON = `serde_json` déjà là). Active `guatx-core/ai` : le cœur ne porte QUE le CONTRAT `AiProvider`
# + helpers purs (rédaction, prompt, couture compilo), lui aussi gated (module `ai` absent sans la feature).
# Sans `--features ai`, TOUT le code IA (module daemon, handlers, routes, entrées rbac) est EXCLU à la
# COMPILATION -> build/test DÉFAUT byte-identiques (0 dep IA). L'inférence est DISTANTE (Ollama/vLLM/
# OpenAI-compat/Anthropic) -> budget 2 Go intact (aucun modèle/tokenizer/vecteur local).
ai = ["guatx-core/ai"]

# LES DÉPENDANCES SONT OPTIMISÉES EN TEST, LE CRATE NE L'EST PAS.
# `cargo test` bâtit ses dépendances avec le profil `dev`, donc à `opt-level = 0` par défaut — dont
# le décodeur `parquet`, `zstd`, `snap`, `thrift` et le SQLCipher vendoré, c'est-à-dire EXACTEMENT le
# code où la suite `--features cold_tier` passe son temps (décodage colonnaire, chiffrement, allers-
# retours SQLite). Le sélecteur `"*"` ne porte QUE sur les dépendances : le crate local reste à
# `opt-level = 0`, donc la compilation qui se refait à CHAQUE commit n'est pas alourdie.
# VÉRIFIÉ PAR LES DEUX TÉMOINS (`cargo build --tests -v`, 2026-08-20) : les caisses tierces reçoivent
# `-C opt-level=2`, la ligne `--crate-name plume_daemon --test` ne reçoit AUCUN `-C opt-level`.
# `[profile.release]` n'est PAS touché : l'artefact livré et l'invariant « mode 0 byte-identique »
# restent au même octet. `debug-assertions` et `overflow-checks` restent ACTIFS (l'override ne porte
# que `opt-level`) — un dépassement d'entier dans une dépendance panique toujours sous test.
#
# MESURÉ les 2026-08-19 et 2026-08-20 (12 cœurs, `-j 4`, TMPDIR sur DISQUE, arbre bâti d'avance,
# MÊME arbre source dans les deux bras, seul l'`opt-level` des dépendances change) :
#   suite `--features cold_tier` ... 2392,76 s -> 589,91 s   rc=0, EXPECTED_COLD_TESTS passés
#                                                            dans les DEUX bras
#   suite par défaut ...............  197,63 s -> 144,28 s   rc=0, EXPECTED_TESTS passés
#                                                            dans les DEUX bras
#   compilation À FROID du graphe ..  279 s    -> 364 s      (247 caisses ; +85 s, payés une fois
#                                                             par clé de cache, pas par commit)
# (les deux compteurs vivent dans .github/workflows/ci.yml et NULLE PART AILLEURS ; les citer par
#  leur NOM plutôt que par leur valeur est ce qui empêche cette mesure de pourrir quand la suite
#  grossit — une garde de la CI refuse la copie)
# Les cinq tests les plus chers, chronométrés SEULS (`--exact --test-threads=1`), avant -> après :
#   cold_store::tests::p6_parity_parallel_eq_sequential_eq_oracle .. 398,1 s ->  16,4 s
#   cold_store::tests::p6_bench_parallel_vs_sequential_decode ...... 330,3 s ->  37,6 s
#   cold_store::tests::p6_ram_bounded_peak_concurrency_le_degree ... 208,8 s ->  14,9 s
#   cold_store::tests::p6_adv_multirun_parity_overlapping_keys ..... 190,7 s ->   9,3 s
#   cold_store::tests::parity_hot_vs_cold_over_the_row_cap ......... 102,1 s ->  10,0 s
# 52 tests de cette suite dépassaient 60 s ; l'ordre de FIN dans la sortie du harnais n'est PAS un
# classement de durée — le tout dernier test à rendre `ok` coûte 3,2 s seul, il attendait un fil.
#
# CE QUE ÇA NE FAIT PAS : aucun test retiré, ignoré, filtré ni sharding ; aucun seuil relâché. Les
# compteurs asservis de la CI (EXPECTED_TESTS / EXPECTED_COLD_TESTS) sont INCHANGÉS, et c'est la
# preuve que la couverture est la même — un gain obtenu en gardant moins les ferait chuter. Ça ne
# rend pas non plus le tier froid plus rapide EN PRODUCTION : `[profile.release]` compile déjà ce
# code optimisé, le défaut ne vivait que dans le profil de test.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
