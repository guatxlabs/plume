# cargo-deny — contrôles supply-chain (lancer : cargo deny check, depuis daemon/)
[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "warn"

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "MPL-2.0",
  "Unicode-DFS-2016", "Unicode-3.0", "CC0-1.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
