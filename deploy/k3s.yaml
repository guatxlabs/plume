# Plume central dans k3s / Kubernetes. Manifeste COMPLET et applicable tel quel :
# Namespace + Secret + PVC + Deployment + Service + Ingress + NetworkPolicy.
#
#   1) AUCUNE IMAGE N'EST PUBLIÉE À CE JOUR -> vous construisez et importez la vôtre :
#        docker build -t soc:latest .
#        docker save soc:latest | sudo k3s ctr images import -
#      (aucun registre requis ; `imagePullPolicy: IfNotPresent` utilise l'image importée)
#   2) plume-daemon hashpw 'tonmdp'   -> mets le hash dans le Secret ci-dessous
#   3) remplace `soc.tondomaine.tld` (PLUME_HOST **et** l'Ingress — ils DOIVENT correspondre :
#      PLUME_HOST est la garde anti-DNS-rebinding, un écart renvoie 421)
#   4) kubectl apply -f deploy/k3s.yaml
#
# Les hôtes/agents poussent leur télémétrie vers le Service via POST /api/ingest (bootstrap-agent.sh).
apiVersion: v1
kind: Namespace
metadata: { name: soc }
---
apiVersion: v1
kind: Secret
metadata: { name: soc-auth, namespace: soc }
type: Opaque
stringData:
  PLUME_USER: "admin"
  PLUME_PASS_HASH: "REMPLACER_PAR_LE_HASH"   # plume-daemon hashpw 'tonmdp'
  # CHIFFREMENT AT-REST (SQLCipher) — APPORTEZ VOTRE PROPRE CLÉ. Cette entrée est le chemin
  # « bring-your-own-key » : mets une passphrase forte ici, PUIS décommente le bloc
  # `PLUME_DB_KEY_FILE` du Deployment ET son montage (fichier en lecture seule — préféré à une
  # variable d'env, qui reste lisible via `kubectl exec` dans /proc/<pid>/environ). Renseigner cette
  # valeur SEULE ne suffit pas : elle n'atteint le conteneur que par ce montage.
  # LAISSÉE VIDE, ELLE NE SIGNIFIE PLUS « base en clair » (`P9.6-a`) : le Deployment pose
  # `PLUME_DB_KEY_AUTO_PATH`, et sur un PVC VIERGE le démon engendre lui-même une clé au premier
  # démarrage (0600, sur le PVC) — la base naît CHIFFRÉE et le scheduler de sauvegarde a de quoi
  # produire ses archives. Sur un PVC qui porte DÉJÀ une base en clair, rien n'est engendré et rien
  # n'est converti : le démarrage ne franchit jamais cette porte-là.
  # PERTE DE CLÉ = PERTE DE LA BASE **ET** DE TOUTES SES ARCHIVES. Sauvegarde-la HORS du cluster :
  #   kubectl -n soc exec deploy/soc -- cat /data/plume-at-rest.key
  # puis pose `PLUME_DB_KEY_ESCROWED=1` dans le Deployment. Tant que ce n'est pas fait, le démon
  # écrit à chaque ouverture de la base un événement de posture NON PURGEABLE, ineffaçable.
  PLUME_DB_KEY: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: soc-data, namespace: soc }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    # 1Gi = un DÉMARRAGE, pas une capacité de production. Ce volume porte la base ET, dès que le
    # scheduler natif peut aboutir, ses archives locales (`/data/backups`, KEEP-N ci-dessous) — TEL
    # QUEL, avec la clé du Secret vide et non injectée, il n'en porte AUCUNE (`P9.4-b`). Dimensionne-le
    # sur ta rétention réelle et ton volume d'événements : un PVC saturé arrête l'ingestion. Volume non
    # mesuré ici — observe la croissance réelle avec `plume-daemon db-stats` avant de figer la taille.
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: soc, namespace: soc }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: soc } }
  template:
    metadata: { labels: { app: soc } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: soc
          image: soc:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: PLUME_ADDR, value: "0.0.0.0:7000" }
            - { name: PLUME_HOST, value: "soc.tondomaine.tld" }   # = Host de l'Ingress (sinon 421)
            - { name: PLUME_CONFIG, value: "/nonexistent" }
            - { name: PLUME_USER,      valueFrom: { secretKeyRef: { name: soc-auth, key: PLUME_USER } } }
            - { name: PLUME_PASS_HASH, valueFrom: { secretKeyRef: { name: soc-auth, key: PLUME_PASS_HASH } } }
            # CHIFFREMENT AT-REST (`P9.6-a`) — TROIS PROVENANCES, DANS CET ORDRE DE PRÉCÉDENCE.
            #   1. PLUME_DB_KEY_FILE (ci-dessous, commenté) — votre propre clé, montée en lecture
            #      seule depuis le Secret. FAIL-CLOSED : chemin posé mais fichier absent/vide -> le
            #      démon REFUSE de démarrer (exit 78) au lieu d'ouvrir la base en clair en silence.
            #   2. PLUME_DB_KEY en variable d'env — ce Deployment ne l'injecte PAS, délibérément.
            #   3. PLUME_DB_KEY_AUTO_PATH — la clé que le démon ENGENDRE lui-même sur un PVC VIERGE,
            #      quand aucune des deux précédentes n'est fournie. C'est le défaut de ce manifeste.
            # - { name: PLUME_DB_KEY_FILE, value: "/etc/plume/secrets/PLUME_DB_KEY" }
            - { name: PLUME_DB_KEY_AUTO_PATH, value: "/data/plume-at-rest.key" }
            # ACQUITTEMENT DE MISE À L'ABRI — à décommenter UNE FOIS la clé copiée hors du cluster.
            # Livré COMMENTÉ, délibérément : un acquittement livré par défaut n'acquitte rien.
            # - { name: PLUME_DB_KEY_ESCROWED, value: "1" }
            #
            # LE DÉMARRAGE NE CONVERTIT JAMAIS UNE BASE EXISTANTE. Poser une clé sur un déploiement
            # dont la base est EN CLAIR ne la réécrit pas : le démon REFUSE de démarrer et nomme le
            # geste explicite `plume-daemon chiffrer-au-repos`, qui exige une sauvegarde produite ET
            # vérifiée, la place pour une seconde base, et PLUME_DB_KEY_ESCROWED=1. IL EST
            # IRRÉVERSIBLE. Tant qu'il n'a pas eu lieu, retirer la clé remet le déploiement dans son
            # état exact.
            #
            # --- OPS NATIVES : BACKUP + AUTO-VACUUM DANS LE BINAIRE (zéro sidecar, zéro CronJob) ---
            # Les deux boucles sont GATÉES sur un intervalle > 0. Sans ces variables, ce déploiement
            # NE SAUVEGARDE RIEN.
            #
            # CE QUI A CHANGÉ DEPUIS `P9.4-b`. Ce manifeste ARMAIT un cycle qui, toutes les 6 h,
            # partait, échouait et n'écrivait rien : le scheduler natif produit une archive
            # COMPRESSÉE+CHIFFRÉE, qui EXIGE une clé de base non vide, et aucune des variables
            # at-rest n'atteignait ce conteneur. Sur un PVC VIERGE, la clé engendrée
            # (`PLUME_DB_KEY_AUTO_PATH` ci-dessus) satisfait désormais cette précondition et les
            # cycles publient. Sur un PVC dont la base est restée EN CLAIR, elle ne l'est toujours
            # pas — et le cycle continue de le DIRE : chaque cycle sans archive écrit un événement de
            # posture NON PURGEABLE (source `plume-config`, category `health`, sév. 4, au plus un par
            # heure) qui nomme l'étape et la cause. La vérification directe :
            #   kubectl -n soc exec deploy/soc -- ls -1 /data/backups
            # un répertoire sans `plume-<TS>.db.age` est un déploiement SANS sauvegarde.
            - { name: PLUME_BACKUP_INTERVAL, value: "21600" }   # secondes ; 0 = désactivé. 21600 = 6 h
            # KEEP-N = PLAFOND de ce qui est CONSERVÉ, pas une promesse d'archives : il borne ce que les
            # cycles ont écrit, il ne l'écrit pas. 24 archives à 6 h couvriraient ~6 jours SI chaque
            # cycle publiait. Sur un PVC vierge, la clé engendrée les fait publier ; sur un PVC dont
            # la base est restée en clair, ce plafond ne garde rien parce qu'il n'y a rien à garder.
            - { name: PLUME_BACKUP_KEEP,     value: "24" }      # rétention KEEP-N
            - { name: PLUME_BACKUP_DEST,     value: "/data/backups" }  # répertoire LOCAL (sur le PVC)
            # ESCROW HORS-CLUSTER : clé PUBLIQUE age (`age1…`). Ce n'est PAS un secret -> elle peut
            # rester en clair ici. NON POSÉE -> repli sur le chiffrement SYMÉTRIQUE (passphrase = clé
            # SQLCipher, présente sur le nœud) donc les backups sont DÉCHIFFRABLES PAR LE NŒUD : pas
            # d'escrow. Le cycle de sauvegarde de CE conteneur émet alors, à chaque archive publiée
            # sans destinataire (au plus une fois par heure), un événement de posture non purgeable
            # (source `plume-config`, health, sév. 4) ; et, à chaque archive publiée alors qu'aucun
            # exercice de restauration frais n'est enregistré (au plus une fois par jour), un
            # événement « restauration non éprouvée » (même source, sév. 3).
            # CES DEUX SIGNAUX SONT CONDITIONNÉS À UNE ARCHIVE PUBLIÉE : tant que la clé manque, il n'y
            # a pas d'archive, donc ni l'un ni l'autre ne part — c'est le signal « aucune archive
            # publiée » (`P9.4-b`) qui parle, et lui seul.
            # Mets PLUME_BACKUP_REQUIRE_ASYMMETRIC=1 pour REFUSER ce repli.
            # - { name: PLUME_BACKUP_AGE_RECIPIENT, value: "age1..." }
            # - { name: PLUME_BACKUP_REQUIRE_ASYMMETRIC, value: "1" }
            # Facteur de travail scrypt du repli par passphrase, borné [10, 20]. Défaut 12 =
            # 4 194 304 octets de tampon — FIXE, donc la sauvegarde ne dépend plus de la vitesse du
            # nœud (avant le 2026-08-09, `age` l'étalonnait au chrono : 19 à 20 mesurés en release,
            # soit 512 Mio à 1 Gio sous un budget de 2 Gio). À ne relever QUE si PLUME_DB_KEY est une
            # phrase tapée par un humain — le tier froid protège déjà le même secret à log_n=12.
            # - { name: PLUME_BACKUP_SCRYPT_LOG_N, value: "12" }
            #
            # Auto-vacuum incrémental (non bloquant). INOPÉRANT — avec un warn honnête, jamais de
            # VACUUM plein bloquant — si la base n'est pas en `auto_vacuum=INCREMENTAL` (`db-stats`).
            - { name: PLUME_AUTOVACUUM_INTERVAL, value: "86400" }
            # Borne les arenas malloc glibc : mesuré 2300 -> 310 MiB de RSS sur ce process (nombreux
            # threads : rollup/refresh/ingest + pool read-only). Indispensable pour tenir la limite 2Gi.
            - { name: MALLOC_ARENA_MAX, value: "2" }
          ports: [ { containerPort: 7000 } ]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp,  mountPath: /tmp }
            # Montage de la clé SQLCipher — décommente avec PLUME_DB_KEY_FILE ci-dessus.
            # - { name: db-key, mountPath: /etc/plume/secrets, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            # 2Gi = le budget de référence du daemon (cf. ARCHITECTURE §11 et
            # systemd/plume-daemon.service : sous ~256Mi le daemon OOM au boot).
            requests: { memory: 256Mi, cpu: 50m }
            limits:   { memory: 2Gi, cpu: "1" }
          readinessProbe: { httpGet: { path: /manifest.webmanifest, port: 7000 }, initialDelaySeconds: 3 }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: soc-data } }
        - { name: tmp,  emptyDir: {} }
        # - { name: db-key, secret: { secretName: soc-auth, items: [ { key: PLUME_DB_KEY, path: PLUME_DB_KEY } ] } }
---
apiVersion: v1
kind: Service
metadata: { name: soc, namespace: soc }
spec:
  selector: { app: soc }
  ports: [ { port: 7000, targetPort: 7000 } ]
---
# Ingress — route Host=soc.tondomaine.tld -> svc soc:7000. Testé avec Traefik (l'ingress controller
# par défaut de k3s) ; `ingressClassName` est à adapter pour nginx/HAProxy/autre.
# TLS : décommente le bloc `tls:` et fournis le Secret de certificat (cert-manager, ou
# `kubectl create secret tls soc-tls --cert=… --key=…`). SANS TLS, le mot de passe admin et les
# cookies de session transitent EN CLAIR — n'expose jamais cet Ingress sur Internet sans certificat.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: soc
  namespace: soc
spec:
  ingressClassName: traefik
  # tls:
  #   - hosts: [ "soc.tondomaine.tld" ]
  #     secretName: soc-tls
  rules:
    - host: soc.tondomaine.tld          # DOIT être identique à PLUME_HOST (garde anti-rebinding)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: soc
                port: { number: 7000 }
---
# NetworkPolicy — DEFAULT-DENY sur les DEUX sens, puis on ré-autorise le STRICT nécessaire.
# POURQUOI L'EGRESS COMPTE ICI : un SIEM concentre les données les plus sensibles du parc. En
# coupant l'egress par défaut, un daemon compromis (ou un connecteur mal configuré) ne peut pas
# exfiltrer vers Internet — il ne reste que le DNS du cluster.
#
# CE QUE ÇA CASSE SI VOUS L'ÉTENDEZ PAS : toute fonctionnalité SORTANTE est bloquée tant que vous
# n'ajoutez pas la règle correspondante — connecteurs `http_pull` (API vendeur), notifications
# sortantes (SMTP/webhook), fournisseur LDAP/IdP, fournisseur d'IA distant, upload de backup.
# L'ingestion par les agents n'est PAS concernée : les agents POUSSENT (ingress), ils ne sont pas
# interrogés. Ajoutez alors un bloc `egress` ciblé (jamais un `0.0.0.0/0` global).
#
# PRÉREQUIS : le CNI doit APPLIQUER les NetworkPolicy. k3s livre flannel, qui NE LES APPLIQUE PAS
# tout seul — k3s embarque kube-router pour ça et l'active par défaut, mais un cluster démarré avec
# `--disable-network-policy` (ou un autre CNI sans support) ACCEPTE ce manifeste SANS RIEN FILTRER.
# Vérifiez-le pour de vrai plutôt que de le supposer : depuis le pod, une sortie Internet doit
# échouer  ->  kubectl -n soc exec deploy/soc -- curl -sS --max-time 5 https://example.com
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soc-default-deny
  namespace: soc
spec:
  podSelector: { matchLabels: { app: soc } }
  policyTypes: [Ingress, Egress]
  ingress:
    # L'UI/API via l'ingress controller, et les agents qui poussent sur /api/ingest.
    # `namespaceSelector: {}` = depuis N'IMPORTE QUEL namespace du cluster, port 7000 seulement.
    # Resserrez-le sur le namespace de votre ingress controller (kube-system pour Traefik/k3s) dès
    # que vos agents poussent via l'Ingress plutôt qu'en direct sur le Service.
    - from:
        - namespaceSelector: {}
      ports:
        - { protocol: TCP, port: 7000 }
  egress:
    # DNS du cluster UNIQUEMENT. Rien d'autre ne sort.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
