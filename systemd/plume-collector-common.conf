# Plume host collectors — shared hardening drop-in.
# Installed by bootstrap-agent.sh (install_collector) as
#   /etc/systemd/system/plume-<collector>.service.d/50-plume-hardening.conf
# so every host collector inherits the same sandbox as the daemon
# (plume-daemon.service) without duplicating the block in ~40 unit files.
#
# Also installed by bootstrap.sh (central) on its twelve collector units — the SAME file,
# byte for byte, on both installers (P10.33-d).
#
# ADDITIVE for LIST-typed settings only : RestrictAddressFamilies, SystemCallFilter
# and ReadWritePaths UNION with the unit's own — never subtract. A
# RestrictAddressFamilies= line here would therefore WIDEN every unit that declares
# fewer families (it did, until P10.33-d : AF_UNIX AF_NETLINK AF_INET AF_INET6 on every
# agent collector, while the central dropped the line). THE LINE IS GONE : each unit
# declares its OWN families, derived from what its script actually calls (curl, kubectl,
# cscli, skopeo, trivy = AF_INET/AF_INET6 ; nft, auditctl, ss, ip = AF_NETLINK ; docker,
# crictl, systemctl, fail2ban-client = AF_UNIX), and
# `.github/scripts/check_an_installation_is_hardened_in_every_mode.py` fails the build if a
# unit declares none, misses one its script opens, declares one nothing opens, or if the
# line comes back here.
# ReadWritePaths is
# restated here so spool+state stay writable even for the few units that previously
# set a looser ProtectSystem= (this drop-in forces ProtectSystem=strict uniformly).
#
# !! SCALAR settings are NOT additive : systemd applies LAST-WINS, and a drop-in is
# parsed AFTER the unit — so a value below OVERRIDES the unit's own, even when the
# unit's value was the deliberate one. This is not theoretical, and it COST COVERAGE :
#   MEASURED 2026-08-01 (Ubuntu 24.04.4) — a `ProtectHome=true` line HERE overrode the
#   `ProtectHome=read-only` that plume-integrity.service sets ON PURPOSE (see the
#   comment in that unit). `systemctl show plume-integrity.service -p ProtectHome`
#   returned `yes`, /root/.ssh and /home/*/ were then INVISIBLE to the collector, and
#   the FIM baseline built under systemd contained ZERO `authkeys` entry. SSH
#   authorized_keys, an ADVERTISED persistence vector of integrity.sh (header, point
#   (b)) and a shipped detection (docs/DETECTION-CATALOG.md, T1098.004), was therefore
#   NOT monitored, silently : the glob simply matched nothing, no warning.
#   RE-MEASURED 2026-08-20 (systemd 261, single-variable differential probe, the
#   collector run AS SHIPPED) : the FIM baseline loses EXACTLY ONE family under
#   `ProtectHome=yes` — 86 lines instead of 87, and the missing kind is `authkeys`.
#   The two installers did not even agree : bootstrap.sh (central) then installed the
#   unit WITHOUT this drop-in, so the same collector was covered there and blind on
#   agents. Since P10.32-j it installs it too, and since P10.33-d the very same file
#   (see bootstrap.sh) : both installers now apply the same sandbox.
#
# THE `ProtectHome=` LINE IS THEREFORE GONE FROM THIS FILE, and that setting is owned by
# each unit. This does NOT loosen anything, and it is enforced rather than trusted :
# `.github/scripts/check_fim_coverage_is_reachable.py` fails the build if any
# systemd/plume-*.service stops declaring its own `ProtectHome=`, and, separately, if a
# path the integrity collector ADVERTISES becomes unreachable under the sandbox this
# drop-in actually produces. Re-adding a scalar here that a unit already sets will turn
# that guard red and NAME the family it silences.
#
# `PrivateTmp=` IS GONE FROM THIS FILE TOO (P10.33-d), for the very same reason. The
# `PrivateTmp=true` line here overrode the `PrivateTmp=false` that plume-yara.service
# sets ON PURPOSE : /tmp, /var/tmp and /dev/shm are where dropped malware sits, and
# collectors/yara.sh scans them by default (PLUME_YARA_PATHS). On every agent, YARA was
# handed a fresh empty /tmp and /var/tmp — two of its four default targets scanned
# nothing, silently. Every unit now declares its own `PrivateTmp=` (true, except where
# the collector must see the host /tmp), and check_fim_coverage_is_reachable.py fails if
# a unit declares none, if a scan target a collector ADVERTISES is masked, or if a scalar
# here overrides a different value set by a unit — naming that unit.
# Before adding or changing a scalar here, check every unit that sets the same key,
# and re-measure the collector's COVERAGE — a stricter sandbox can mean less signal.
#
# SystemCallFilter=@system-service is the load-bearing addition (no collector
# unit had a syscall filter before; only the daemon did). @system-service is
# the standard allow-list for long-running/oneshot services and covers every
# syscall the collectors' tools use (sh, coreutils, sed/awk, nft, kubectl/k3s,
# jq, journalctl, curl). Verified per collector type at rollout.
[Service]
NoNewPrivileges=true
ProtectSystem=strict
# NO `ProtectHome=`, NO `PrivateTmp=` HERE — scalars owned by each unit, see above.
# NO `RestrictAddressFamilies=` HERE — a list, it would UNION ; owned by each unit.
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictNamespaces=true
LockPersonality=true
SystemCallFilter=@system-service
SystemCallArchitectures=native
ReadWritePaths=/var/lib/plume/spool /var/lib/plume/state
