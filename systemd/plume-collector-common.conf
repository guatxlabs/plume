# Plume host collectors — shared hardening drop-in.
# Installed by bootstrap-agent.sh (install_collector) as
#   /etc/systemd/system/plume-<collector>.service.d/50-plume-hardening.conf
# so every host collector inherits the same sandbox as the daemon
# (plume-daemon.service) without duplicating the block in ~40 unit files.
#
# ADDITIVE for LIST-typed settings only : RestrictAddressFamilies, SystemCallFilter
# and ReadWritePaths UNION with the unit's own — never subtract. ReadWritePaths is
# restated here so spool+state stay writable even for the few units that previously
# set a looser ProtectSystem= (this drop-in forces ProtectSystem=strict uniformly).
#
# !! SCALAR settings are NOT additive : systemd applies LAST-WINS, and a drop-in is
# parsed AFTER the unit — so a value below OVERRIDES the unit's own, even when the
# unit's value was the deliberate one. This is not theoretical :
#   MEASURED 2026-08-01 (Ubuntu 24.04.4) — `ProtectHome=true` below overrides the
#   `ProtectHome=read-only` that plume-integrity.service sets ON PURPOSE (see the
#   comment in that unit). `systemctl show plume-integrity.service -p ProtectHome`
#   returns `yes`, /root/.ssh and /home/*/ are then INVISIBLE to the collector, and
#   the FIM baseline built under systemd contains ZERO `authkeys` entry — versus 2
#   when the same collector runs outside the sandbox. SSH authorized_keys, an
#   ADVERTISED persistence vector of integrity.sh (header, point (b)), is therefore
#   NOT monitored today, silently : the glob simply matches nothing, no warning.
# Before adding or changing a scalar here, check every unit that sets the same key,
# and re-measure the collector's COVERAGE — a stricter sandbox can mean less signal.
#
# SystemCallFilter=@system-service is the load-bearing addition (no collector
# unit had a syscall filter before; only the daemon did). @system-service is
# the standard allow-list for long-running/oneshot services and covers every
# syscall the collectors' tools use (sh, coreutils, sed/awk, nft, kubectl/k3s,
# jq, journalctl, curl). Verified per collector type at rollout.
[Service]
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6
RestrictNamespaces=true
LockPersonality=true
SystemCallFilter=@system-service
SystemCallArchitectures=native
ReadWritePaths=/var/lib/plume/spool /var/lib/plume/state
